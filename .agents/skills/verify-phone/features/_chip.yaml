# Brings ${CHIP} into view in a card form's chip row, scrolling either way, with the row at the foot
# or riding over the keyboard, which comes back on the term once a sheet closes.
appId: app.lymi
---
- repeat:
    times: 3
    while:
      notVisible: "${CHIP}"
    commands:
      - swipe:
          start: 85%, 92%
          end: 5%, 92%
- repeat:
    times: 3
    while:
      notVisible: "${CHIP}"
    commands:
      - swipe:
          start: 15%, 92%
          end: 95%, 92%
- repeat:
    times: 3
    while:
      notVisible: "${CHIP}"
    commands:
      - swipe:
          start: 85%, 62%
          end: 5%, 62%
- repeat:
    times: 3
    while:
      notVisible: "${CHIP}"
    commands:
      - swipe:
          start: 15%, 62%
          end: 95%, 62%

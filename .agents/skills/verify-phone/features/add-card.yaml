# Add a card: open capture from Today's top bar, write a term and its meaning with the AI off, and add it.
appId: app.lymi
name: Add a card
---
- runFlow: _open.yaml
- tapOn: "Today"
- tapOn: "Add a card"
- extendedWaitUntil:
    visible: "Add to .*"
    timeout: 20000
# A fresh Simulator teaches the slide-to-type keyboard once.
- tapOn:
    text: "Continue"
    optional: true
- assertVisible: "Deck: ${DECK}"
# The deck choice lists only decks the learner owns, so the joined deck is not there.
- tapOn: "Deck: ${DECK}"
- extendedWaitUntil:
    visible: "${DECK}"
    timeout: 10000
- assertNotVisible: "${SHARED}"
- takeScreenshot: 00-decks
- tapOn: "${DECK}"
# Capture remembers the AI switch, so turn it off only when it is on.
- runFlow:
    when:
      visible: "Meaning Leave it empty.*"
    commands:
      - tapOn: "Fill in the rest with AI"
- assertVisible: "Meaning What it means"
- tapOn: "Term.*"
- inputText: "${TERM}"
- tapOn: "Meaning.*"
- inputText: "${MEANING}"
- takeScreenshot: 01-filled
- tapOn: "Add to .?${DECK}.?"
- extendedWaitUntil:
    visible: "Added “.?${TERM}.?” to .?${DECK}.?"
    timeout: 20000
- takeScreenshot: 02-added
- tapOn: "^Done$"

# Enrich from the card page's ⋯ and from a card's long-press menu.
appId: app.lymi
name: Enrich a card
---
- runFlow: _open.yaml
- openLink: lymi://library/card/${CARD_ID}?deck=${DECK_ID}
- extendedWaitUntil:
    visible: "Details"
    timeout: 20000
- tapOn: "Card options"
- extendedWaitUntil:
    visible: "Enrich"
    timeout: 10000
- assertVisible: "Edit card"
- takeScreenshot: 01-card-menu
- tapOn: "Enrich"
- extendedWaitUntil:
    visible: "Couldn’t enrich “${TERM}”.*"
    timeout: 20000
- takeScreenshot: 02-request-failed
- openLink: lymi://library/${DECK_ID}
- extendedWaitUntil:
    visible: "Search this deck"
    timeout: 20000
- scrollUntilVisible:
    element: "${OTHER_TERM}, .*"
    centerElement: true
- longPressOn: "${OTHER_TERM}, .*"
- extendedWaitUntil:
    visible: "Enrich"
    timeout: 10000
- assertVisible: "Edit card"
- takeScreenshot: 03-long-press-menu
- tapOn: "Enrich"
- extendedWaitUntil:
    visible: "Couldn’t enrich “${OTHER_TERM}”.*"
    timeout: 20000
- takeScreenshot: 04-long-press-failed

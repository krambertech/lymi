# Chinese: a New card keeps its pinyin under the term cue before the reveal, and shows it once.
appId: app.lymi
name: Chinese
---
- runFlow: _open.yaml
- tapOn: "Library"
- tapOn: "${DECK}.*"
- tapOn: "^Review.*"
- extendedWaitUntil:
    visible: ".*${TERM}.*Tap to reveal"
    timeout: 30000
- assertVisible: ".*${READING}.*"
- assertNotVisible: ".*${MEANING}.*"
- takeScreenshot: 01-new-cue-with-pinyin
# The card's centre can be its pronunciation button, so reveal by tapping low on the card.
- tapOn:
    point: "50%,80%"
- assertVisible: "^Good.*"
- assertVisible: ".*${MEANING}.*"
- takeScreenshot: 02-revealed

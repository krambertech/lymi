# A deck filtered by one tag: the sheet's count and Tags level, Reset and Cancel, then the filtered review from the accessory.
appId: app.lymi
name: Deck filters
---
- runFlow: _open.yaml
- openLink: lymi://library/${DECK_ID}
- extendedWaitUntil:
    visible: "Search this deck"
    timeout: 20000
- tapOn: "Filter"
- extendedWaitUntil:
    visible: "${TOTAL} cards"
    timeout: 10000
- assertVisible: "Any tag"
- takeScreenshot: 01-filter-sheet
- tapOn: "Any tag"
- extendedWaitUntil:
    visible: "Tags"
    timeout: 10000
- tapOn: "${TAG}.*"
- assertVisible: "${KEPT} of ${TOTAL} cards"
- takeScreenshot: 02-tags-level
- tapOn: "Apply filters"
- extendedWaitUntil:
    notVisible: "Apply filters"
    timeout: 10000
- assertVisible: "${TAGGED_TERM}, .*"
- assertNotVisible: "${OTHER_TERM}, .*"
- extendedWaitUntil:
    visible: "Review ${DUE} filtered cards?"
    timeout: 20000
- takeScreenshot: 03-filtered-list
# Reset clears the draft only; Cancel leaves the filters as they were.
- tapOn: "Filter"
- extendedWaitUntil:
    visible: "${KEPT} of ${TOTAL} cards"
    timeout: 10000
- assertVisible: "${TAG}"
- tapOn: "Reset filters"
- assertVisible: "${TOTAL} cards"
- assertVisible: "Any tag"
- takeScreenshot: 04-reset-draft
- tapOn: "Cancel"
- extendedWaitUntil:
    notVisible: "Apply filters"
    timeout: 10000
- assertNotVisible: "${OTHER_TERM}, .*"
- tapOn: "Review ${DUE} filtered cards?"
- extendedWaitUntil:
    visible: ".*Tap to reveal"
    timeout: 30000
- takeScreenshot: 05-filtered-review
- repeat:
    times: ${DUE}
    commands:
      - tapOn:
          point: "50%,80%"
      - tapOn: "^Good.*"
- extendedWaitUntil:
    visible: "No filtered cards left"
    timeout: 20000
- takeScreenshot: 06-no-filtered-left

# Delete account: the row opens the web page, and closing it after the delete signs the phone out.
appId: app.lymi
name: Delete account
---
- runFlow: _open.yaml
- tapOn: "You"
- scrollUntilVisible:
    element: "Delete account"
- takeScreenshot: 01-row
- tapOn: "Delete account"
- extendedWaitUntil:
    visible: "Sign in to Lymi|What goes"
    timeout: 30000
- takeScreenshot: 02-web-page
- runScript:
    file: delete-account.js
    env:
      WORKER: ${WORKER}
      COOKIE: ${COOKIE}
      EMAIL: ${EMAIL}
- tapOn: "Done"
- extendedWaitUntil:
    visible: "Dev sign-in as learner"
    timeout: 30000
- takeScreenshot: 03-signed-out

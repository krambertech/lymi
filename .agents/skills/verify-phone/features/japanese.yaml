# Japanese: furigana over a Known and a New card's term in review, over an example, a deck's row,
# the card page and search, and the Reading field.
appId: app.lymi
name: Japanese
---
- runFlow: _open.yaml
# A Known card's cue keeps the furigana's room but hides it, and its label does not read it out.
- tapOn: "Library"
- tapOn: "${KNOWN_DECK}.*"
- tapOn: "^Review.*"
- extendedWaitUntil:
    visible: ".*${KNOWN_TERM}. Tap to reveal"
    timeout: 30000
- assertNotVisible: ".*read ${KNOWN_READING}.*"
- takeScreenshot: 01-known-cue-hidden
# The card's centre can be its pronunciation button, so reveal by tapping low on the card.
- tapOn:
    point: "50%,80%"
- assertVisible: "^Good.*"
- assertVisible: ".*${KNOWN_READING}.*"
- takeScreenshot: 02-known-revealed
- tapOn: "End review"
- tapOn: "Library"
# A New card's cue draws the furigana, and its label reads it.
- tapOn: "${DECK}.*"
- tapOn: "^Review.*"
- extendedWaitUntil:
    visible: ".*${TERM}, read ${READING}. Tap to reveal"
    timeout: 30000
- takeScreenshot: 03-new-cue-furigana
- tapOn:
    point: "50%,80%"
- assertVisible: "^Good.*"
- assertVisible: ".*${EXAMPLE_SPOKEN}.*"
- takeScreenshot: 04-new-revealed-example
# Ending review mid-deck lands on the deck page, where the row draws the furigana too.
- tapOn: "End review"
- extendedWaitUntil:
    visible: "${TERM}.*"
    timeout: 20000
- takeScreenshot: 05-deck-row
- tapOn: "${TERM}.*"
- extendedWaitUntil:
    visible: ".*${EXAMPLE_SPOKEN}.*"
    timeout: 20000
- assertVisible: ".*Reading.*"
- takeScreenshot: 06-card-page
- tapOn: ".*Reading.*"
- extendedWaitUntil:
    visible: "Reading"
    timeout: 20000
- takeScreenshot: 07-edit-reading-field
- tapOn: "Cancel"
- openLink: "lymi://search?q=%E7%9B%B4%E8%A7%92"
- extendedWaitUntil:
    visible: "${TERM}.*"
    timeout: 20000
- takeScreenshot: 08-search

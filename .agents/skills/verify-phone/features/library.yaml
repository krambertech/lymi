# Library and the deck page: the deck list, the first deck's page, and one of its cards.
appId: app.lymi
name: Library
---
- runFlow: _open.yaml
- tapOn: "Library"
- extendedWaitUntil:
    visible: "New deck"
    timeout: 20000
- takeScreenshot: 01-library
# Deck rows sit inside expo-router's Link.Trigger, which hides them from XCUITest; the first row is tapped by position.
- tapOn:
    point: "50%,24%"
- extendedWaitUntil:
    visible: "${CARDS} cards"
    timeout: 20000
- assertVisible: "${DECK}"
- assertVisible: "Search this deck"
- takeScreenshot: 02-deck
# Centred, so the row is not under the tab bar when it is tapped. The row can sit in the deck's last section, a long scroll away.
- scrollUntilVisible:
    element: "${TERM}, .*"
    centerElement: true
    timeout: 45000
- tapOn: "${TERM}, .*"
- extendedWaitUntil:
    visible: "Details"
    timeout: 20000
# A shared deck's card shows the meaning read-only, as two elements rather than one button.
- assertVisible: "Meaning"
- assertVisible: "${MEANING}"
- takeScreenshot: 03-card
# Back on Library, below the decks and series, which can push it out of view.
- tapOn: "Library"
- extendedWaitUntil:
    visible: "New deck"
    timeout: 20000
- scrollUntilVisible:
    element: "Archived.*"
- takeScreenshot: 04-archived

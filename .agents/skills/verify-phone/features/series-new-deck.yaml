# Series: make a deck from a series' menu and see it join that series last.
appId: app.lymi
name: Series new deck
---
- runFlow: _open.yaml
- tapOn: "Library"
- extendedWaitUntil:
    visible: "${SERIES}"
    timeout: 20000
# The new series is last, under the tab bar, so its menu is brought to the middle first.
- scrollUntilVisible:
    element: "Options for ${SERIES}"
    centerElement: true
- takeScreenshot: 01-library
- tapOn: "Options for ${SERIES}"
- takeScreenshot: 02-menu
# The menu's New deck comes first, above the loose plate's row of the same name.
- tapOn:
    text: "New deck"
    index: 0
- extendedWaitUntil:
    visible: "Series: ${SERIES}"
    timeout: 20000
- inputText: "${DECK}"
# Return lowers the keyboard, so the Series row is in the screenshot.
- pressKey: Enter
- tapOn: "Something else"
- takeScreenshot: 03-form
- tapOn: "Create deck"
- extendedWaitUntil:
    visible: "${DECK}"
    timeout: 20000
- takeScreenshot: 04-deck
- tapOn: "Library"
- extendedWaitUntil:
    visible: "${SERIES}"
    timeout: 20000
- scrollUntilVisible:
    element: "${DECK}.*"
- takeScreenshot: 05-library

# Series: delete a series from Library, keep its decks, and see the series go.
appId: app.lymi
name: Series
---
- runFlow: _open.yaml
- tapOn: "Library"
- extendedWaitUntil:
    visible: "New deck"
    timeout: 20000
# The series is made after launch, so a Library restored from the last run's cache is pulled to refresh.
- swipe:
    start: 50%, 30%
    end: 50%, 75%
# The new series is last, below the fold or under the tab bar, so its menu is brought to the middle.
- scrollUntilVisible:
    element: "Options for ${SERIES}"
    centerElement: true
    timeout: 20000
- takeScreenshot: 01-library
- tapOn: "Options for ${SERIES}"
- tapOn: "Delete series"
# iOS's own alert asks first, since a series write has no Undo.
- extendedWaitUntil:
    visible: "Delete “${SERIES}”\\?"
    timeout: 10000
- assertVisible: "The series is deleted for good. Its decks can stay in Library or be archived with it."
- assertVisible: "Archive the decks"
- takeScreenshot: 02-confirm
- tapOn: "Keep the decks"
- extendedWaitUntil:
    notVisible: "${SERIES}"
    timeout: 20000
- assertVisible: "New deck"
- takeScreenshot: 03-deleted

# Smart add from a link: a YouTube link is named and declined with the offer to paste its
# transcript, and a card whose source is an article's URL links to its site on the card page.
appId: app.lymi
name: Smart add from a link
---
- runFlow: _open.yaml
- tapOn: "Today"
- longPressOn: "Add a card"
- tapOn: "Smart add"
- extendedWaitUntil:
    visible: "Find terms"
    timeout: 20000
- tapOn: "Link"
- tapOn: "Article link"
- inputText: "${YOUTUBE}"
- takeScreenshot: 00-link
- tapOn: "Done"
- extendedWaitUntil:
    visible: "youtu.be/.*"
    timeout: 10000
- takeScreenshot: 01-link-added
- tapOn: "Find terms"
# The persona has not answered, so the phone asks before the link leaves it. ADR 0039.
- runFlow:
    when:
      visible: "Use AI in Lymi?"
    commands:
      - tapOn: "Turn on AI"
- extendedWaitUntil:
    visible: ".*YouTube doesn’t let apps read .*captions.*"
    timeout: 30000
- assertVisible: "Paste the transcript"
- takeScreenshot: 02-youtube
- tapOn: "Paste the transcript"
- extendedWaitUntil:
    visible: "Lesson text"
    timeout: 10000
- takeScreenshot: 03-transcript
- tapOn: "Back"
- tapOn: "Close"
# A card from an article names its site, and the row opens the page.
- tapOn: "Library"
- waitForAnimationToEnd
- tapOn: "${DECK}.*"
- extendedWaitUntil:
    visible: "${TERM}.*"
    timeout: 20000
- tapOn: "${TERM}.*"
- scrollUntilVisible:
    element: "${SITE}"
    direction: DOWN
    timeout: 20000
- takeScreenshot: 04-card-source

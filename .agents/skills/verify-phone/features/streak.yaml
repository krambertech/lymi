# The streak calendar: swipe to the month before and back, then the same with the arrows.
appId: app.lymi
name: Streak calendar
---
- runFlow: _open.yaml
- tapOn: "Today"
- tapOn: "Streak: ${STREAK} days? in a row.*"
- extendedWaitUntil:
    visible: "Change daily goal"
    timeout: 20000
- assertVisible: "${THIS_MONTH}"
- takeScreenshot: 01-this-month
# By position: a day is too narrow to start a page-wide swipe from, and at the peek this row is the calendar's first.
- swipe:
    start: 12%,91%
    end: 88%,91%
    duration: 300
- extendedWaitUntil:
    visible: "${LAST_MONTH}"
    timeout: 5000
- assertNotVisible: "${THIS_MONTH}"
- takeScreenshot: 02-swiped-to-last-month
- swipe:
    start: 88%,91%
    end: 12%,91%
    duration: 300
- extendedWaitUntil:
    visible: "${THIS_MONTH}"
    timeout: 5000
- takeScreenshot: 03-swiped-back
- tapOn: "Previous month"
- extendedWaitUntil:
    visible: "${LAST_MONTH}"
    timeout: 5000
- tapOn: "Next month"
- extendedWaitUntil:
    visible: "${THIS_MONTH}"
    timeout: 5000

# Electron ships a major every eight weeks and supports only the latest three, so the Mac app
# would fall out of support within months if left alone. One pull request a week keeps it current;
# its TypeScript and tests show whether an upgrade changed anything the app uses. docs/stack.md.
version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: weekly
      day: monday
    allow:
      - dependency-name: electron
    groups:
      electron:
        patterns: ["electron"]
    open-pull-requests-limit: 1
    commit-message:
      prefix: "build(desktop)"

name: Changelog publish

# The site is built ahead, so a changelog update dated ahead appears only when a build runs on or after its day.
on:
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: apps/site/src/content/changelog

      # Checks the past week rather than today alone, so a skipped or failed run heals on the next one.
      - name: Rebuild lymi.app when a due update is missing
        env:
          SITE_DEPLOY_HOOK: ${{ secrets.SITE_DEPLOY_HOOK }}
        run: |
          today=$(date -u +%F)
          since=$(date -u -d '7 days ago' +%F)
          missing=""
          for dir in apps/site/src/content/changelog/*/; do
            folder=$(basename "$dir")
            day=${folder:0:10}
            slug=${folder:11}
            if [[ "$day" > "$today" || "$day" < "$since" ]]; then continue; fi
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' "https://lymi.app/changelog/$slug")
            if [ "$status" != "200" ]; then missing="$missing $slug"; fi
          done
          if [ -z "$missing" ]; then
            echo "Every update up to $today is live."
            exit 0
          fi
          echo "Not live yet:$missing"
          if [ -z "$SITE_DEPLOY_HOOK" ]; then
            echo "::error::Updates are due but SITE_DEPLOY_HOOK is not set. Add the lymi-site deploy hook for main as a repository secret."
            exit 1
          fi
          curl --fail-with-body --silent --show-error -X POST "$SITE_DEPLOY_HOOK"

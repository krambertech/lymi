name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      e2e:
        description: Run the browser E2E suite
        required: true
        default: true
        type: boolean

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      run_site_preview: ${{ steps.plan.outputs.run_site_preview }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate pull request title
        id: title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/check-pr-title.mjs "$PR_TITLE"

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Select CI coverage
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MANUAL_E2E: ${{ inputs.e2e }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" | node scripts/ci-plan.mjs
          else
            node scripts/ci-plan.mjs < /dev/null
          fi

      - name: Install dependencies
        id: dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and lint
        id: check
        run: pnpm check

      - name: Check interface strings are extracted
        id: i18n
        run: pnpm i18n:check

      - name: Check migration safety
        id: migrations
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm check:migrations

      - name: Build production application
        id: build
        run: pnpm build

      - name: Check deployment boundaries
        id: boundaries
        run: pnpm check:boundaries

      - name: Check TypeScript
        id: typecheck
        run: pnpm typecheck

      - name: Run unit tests
        id: test
        run: pnpm test

      - name: Check product deployment package
        id: deploy_product
        if: steps.plan.outputs.run_deploy_check == 'true'
        run: pnpm --filter @lymi/web run deploy:check

      - name: Check public-site deployment package
        id: deploy_site
        if: steps.plan.outputs.run_deploy_check == 'true'
        run: pnpm --filter @lymi/site run deploy:check

      - name: Install Playwright browsers (${{ steps.plan.outputs.coverage }})
        id: browsers
        if: steps.plan.outputs.run_e2e == 'true'
        run: pnpm exec playwright install --with-deps --only-shell ${{ steps.plan.outputs.browsers }}

      - name: Run browser E2E (${{ steps.plan.outputs.coverage }})
        id: e2e
        if: steps.plan.outputs.run_e2e == 'true'
        run: pnpm test:e2e ${{ steps.plan.outputs.playwright_args }}

      - name: Summarize CI evidence
        if: always()
        env:
          COVERAGE: ${{ steps.plan.outputs.coverage }}
          PLAN_REASON: ${{ steps.plan.outputs.reason }}
          SITE_PREVIEW: ${{ steps.plan.outputs.run_site_preview }}
          TITLE_OUTCOME: ${{ steps.title.outcome }}
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          MIGRATIONS_OUTCOME: ${{ steps.migrations.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          BOUNDARIES_OUTCOME: ${{ steps.boundaries.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          DEPLOY_PRODUCT_OUTCOME: ${{ steps.deploy_product.outcome }}
          DEPLOY_SITE_OUTCOME: ${{ steps.deploy_site.outcome }}
          BROWSERS_OUTCOME: ${{ steps.browsers.outcome }}
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
        run: node scripts/ci-summary.mjs

      - name: Upload E2E diagnostics
        if: ${{ !cancelled() && steps.e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@v6
        with:
          name: e2e-diagnostics
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  site_preview:
    name: site preview
    needs: check
    if: >-
      github.event_name == 'pull_request' &&
      needs.check.outputs.run_site_preview == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    environment:
      name: site-preview
      url: ${{ steps.preview.outputs.url }}
    steps:
      - uses: actions/checkout@v5

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install public-site dependencies
        run: pnpm install --frozen-lockfile --filter @lymi/site...

      - name: Check preview credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SITE_PREVIEW_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Configure CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_SITE_PREVIEW_TOKEN in the site-preview environment."
            exit 1
          fi

      - name: Build public site
        run: pnpm --filter @lymi/site run build

      - name: Upload stable preview
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SITE_PREVIEW_TOKEN }}
          PREVIEW_ALIAS: pr-${{ github.event.pull_request.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.jsonl
        run: |
          pnpm --filter @lymi/site exec wrangler versions upload \
            --preview-alias "$PREVIEW_ALIAS" \
            --tag "$GITHUB_SHA" \
            --message "Preview for PR #$PR_NUMBER at $GITHUB_SHA"

      - name: Record stable preview link
        id: preview
        env:
          PREVIEW_ALIAS: pr-${{ github.event.pull_request.number }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.jsonl
        run: node scripts/preview-url.mjs "$WRANGLER_OUTPUT_FILE_PATH" lymi-site "$PREVIEW_ALIAS"

      - name: Verify preview version
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          PREVIEW_VERSION_ID: ${{ steps.preview.outputs.version_id }}
        run: node scripts/check-deployment.mjs "$PREVIEW_URL/api/health" lymi-site "$PREVIEW_VERSION_ID" 10

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      e2e:
        description: Run the browser E2E suite
        required: true
        default: true
        type: boolean

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate pull request title
        id: title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/check-pr-title.mjs "$PR_TITLE"

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Select CI coverage
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MANUAL_E2E: ${{ inputs.e2e }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" | node scripts/ci-plan.mjs
          else
            node scripts/ci-plan.mjs < /dev/null
          fi

      - name: Install dependencies
        id: dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and lint
        id: check
        run: pnpm check

      - name: Build production application
        id: build
        run: pnpm build

      - name: Check deployment boundaries
        id: boundaries
        run: pnpm check:boundaries

      - name: Check TypeScript
        id: typecheck
        run: pnpm typecheck

      - name: Run unit tests
        id: test
        run: pnpm test

      - name: Check product deployment package
        id: deploy_product
        if: steps.plan.outputs.run_deploy_check == 'true'
        run: pnpm --filter @lymi/web run deploy:check

      - name: Check public-site deployment package
        id: deploy_site
        if: steps.plan.outputs.run_deploy_check == 'true'
        run: pnpm --filter @lymi/site run deploy:check

      - name: Install Playwright browsers (${{ steps.plan.outputs.coverage }})
        id: browsers
        if: steps.plan.outputs.run_e2e == 'true'
        run: pnpm exec playwright install --with-deps --only-shell ${{ steps.plan.outputs.browsers }}

      - name: Run browser E2E (${{ steps.plan.outputs.coverage }})
        id: e2e
        if: steps.plan.outputs.run_e2e == 'true'
        run: pnpm test:e2e ${{ steps.plan.outputs.playwright_args }}

      - name: Summarize CI evidence
        if: always()
        env:
          COVERAGE: ${{ steps.plan.outputs.coverage }}
          PLAN_REASON: ${{ steps.plan.outputs.reason }}
          TITLE_OUTCOME: ${{ steps.title.outcome }}
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          BOUNDARIES_OUTCOME: ${{ steps.boundaries.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          DEPLOY_PRODUCT_OUTCOME: ${{ steps.deploy_product.outcome }}
          DEPLOY_SITE_OUTCOME: ${{ steps.deploy_site.outcome }}
          BROWSERS_OUTCOME: ${{ steps.browsers.outcome }}
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
        run: node scripts/ci-summary.mjs

      - name: Upload E2E diagnostics
        if: ${{ !cancelled() && steps.e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@v6
        with:
          name: e2e-diagnostics
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

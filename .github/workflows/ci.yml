name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      e2e:
        description: Run the browser E2E suite
        required: true
        default: true
        type: boolean

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      title_outcome: ${{ steps.title.outcome }}
      run_e2e: ${{ steps.coverage.outputs.run_e2e }}
      browsers: ${{ steps.coverage.outputs.browsers }}
      playwright_args: ${{ steps.coverage.outputs.playwright_args }}
      coverage: ${{ steps.coverage.outputs.coverage }}
      run_deploy_check: ${{ steps.coverage.outputs.run_deploy_check }}
      run_app_preview: ${{ steps.coverage.outputs.run_app_preview }}
      run_site_preview: ${{ steps.coverage.outputs.run_site_preview }}
      reason: ${{ steps.coverage.outputs.reason }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate pull request title
        id: title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/check-pr-title.mjs "$PR_TITLE"

      - name: Select CI coverage
        id: coverage
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MANUAL_E2E: ${{ inputs.e2e }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" | node scripts/ci-plan.mjs
          else
            node scripts/ci-plan.mjs < /dev/null
          fi

  quality:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      dependencies_outcome: ${{ steps.dependencies.outcome }}
      check_outcome: ${{ steps.check.outcome }}
      i18n_outcome: ${{ steps.i18n.outcome }}
      migrations_outcome: ${{ steps.migrations.outcome }}
      build_outcome: ${{ steps.build.outcome }}
      boundaries_outcome: ${{ steps.boundaries.outcome }}
      typecheck_outcome: ${{ steps.typecheck.outcome }}
      test_outcome: ${{ steps.test.outcome }}
      deploy_product_outcome: ${{ steps.deploy_product.outcome }}
      deploy_site_outcome: ${{ steps.deploy_site.outcome }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        id: dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and lint
        id: check
        run: pnpm check

      - name: Check interface strings are extracted
        id: i18n
        run: pnpm i18n:check

      - name: Check migration safety
        id: migrations
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm check:migrations

      - name: Build production application
        id: build
        run: pnpm build

      - name: Check deployment boundaries
        id: boundaries
        run: pnpm check:boundaries

      - name: Check TypeScript
        id: typecheck
        run: pnpm typecheck

      # The component tests in `pnpm test` run the primitives in real Chromium and WebKit.
      - name: Install component test browsers
        id: component_browsers
        run: pnpm exec playwright install --with-deps --only-shell chromium webkit

      - name: Run unit and component tests
        id: test
        run: pnpm test

      - name: Check product deployment package
        id: deploy_product
        if: needs.plan.outputs.run_deploy_check == 'true'
        run: pnpm --filter @lymi/web run deploy:check

      - name: Check public-site deployment package
        id: deploy_site
        if: needs.plan.outputs.run_deploy_check == 'true'
        run: pnpm --filter @lymi/site run deploy:check

  browser_e2e:
    name: browser E2E (${{ needs.plan.outputs.coverage }})
    needs: plan
    if: needs.plan.outputs.run_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      dependencies_outcome: ${{ steps.dependencies.outcome }}
      browsers_outcome: ${{ steps.browsers.outcome }}
      e2e_outcome: ${{ steps.e2e.outcome }}
    steps:
      - uses: actions/checkout@v5

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        id: dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers (${{ needs.plan.outputs.coverage }})
        id: browsers
        run: pnpm exec playwright install --with-deps --only-shell ${{ needs.plan.outputs.browsers }}

      - name: Run browser E2E (${{ needs.plan.outputs.coverage }})
        id: e2e
        run: pnpm test:e2e ${{ needs.plan.outputs.playwright_args }}

      - name: Upload E2E diagnostics
        if: ${{ !cancelled() && steps.e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@v6
        with:
          name: e2e-diagnostics
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  check:
    needs: [plan, quality, browser_e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Summarize CI evidence
        env:
          COVERAGE: ${{ needs.plan.outputs.coverage }}
          PLAN_REASON: ${{ needs.plan.outputs.reason }}
          SITE_PREVIEW: ${{ needs.plan.outputs.run_site_preview }}
          APP_PREVIEW: ${{ needs.plan.outputs.run_app_preview }}
          RUN_E2E: ${{ needs.plan.outputs.run_e2e }}
          PLAN_RESULT: ${{ needs.plan.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          BROWSER_RESULT: ${{ needs.browser_e2e.result }}
          TITLE_OUTCOME: ${{ needs.plan.outputs.title_outcome }}
          DEPENDENCIES_OUTCOME: ${{ needs.quality.outputs.dependencies_outcome }}
          CHECK_OUTCOME: ${{ needs.quality.outputs.check_outcome }}
          I18N_OUTCOME: ${{ needs.quality.outputs.i18n_outcome }}
          MIGRATIONS_OUTCOME: ${{ needs.quality.outputs.migrations_outcome }}
          BUILD_OUTCOME: ${{ needs.quality.outputs.build_outcome }}
          BOUNDARIES_OUTCOME: ${{ needs.quality.outputs.boundaries_outcome }}
          TYPECHECK_OUTCOME: ${{ needs.quality.outputs.typecheck_outcome }}
          TEST_OUTCOME: ${{ needs.quality.outputs.test_outcome }}
          DEPLOY_PRODUCT_OUTCOME: ${{ needs.quality.outputs.deploy_product_outcome }}
          DEPLOY_SITE_OUTCOME: ${{ needs.quality.outputs.deploy_site_outcome }}
          BROWSER_DEPENDENCIES_OUTCOME: ${{ needs.browser_e2e.outputs.dependencies_outcome }}
          BROWSERS_OUTCOME: ${{ needs.browser_e2e.outputs.browsers_outcome }}
          E2E_OUTCOME: ${{ needs.browser_e2e.outputs.e2e_outcome }}
        run: node scripts/ci-summary.mjs

  site_preview:
    name: site preview
    needs: [plan, quality]
    if: >-
      needs.quality.result == 'success' &&
      github.event_name == 'pull_request' &&
      needs.plan.outputs.run_site_preview == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    environment:
      name: site-preview
      url: ${{ steps.preview.outputs.url }}
    steps:
      - uses: actions/checkout@v5

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install public-site dependencies
        run: pnpm install --frozen-lockfile --filter @lymi/site...

      - name: Check preview credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SITE_PREVIEW_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Configure CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_SITE_PREVIEW_TOKEN in the site-preview environment."
            exit 1
          fi

      - name: Build public site
        run: pnpm --filter @lymi/site run build

      - name: Upload stable preview
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SITE_PREVIEW_TOKEN }}
          PREVIEW_ALIAS: pr-${{ github.event.pull_request.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.jsonl
        run: |
          pnpm --filter @lymi/site exec wrangler versions upload \
            --preview-alias "$PREVIEW_ALIAS" \
            --tag "$GITHUB_SHA" \
            --message "Preview for PR #$PR_NUMBER at $GITHUB_SHA"

      - name: Record stable preview link
        id: preview
        env:
          PREVIEW_ALIAS: pr-${{ github.event.pull_request.number }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.jsonl
        run: node scripts/preview-url.mjs "$WRANGLER_OUTPUT_FILE_PATH" lymi-site "$PREVIEW_ALIAS"

      - name: Verify preview version
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          PREVIEW_VERSION_ID: ${{ steps.preview.outputs.version_id }}
        run: node scripts/check-deployment.mjs "$PREVIEW_URL/api/health" lymi-site "$PREVIEW_VERSION_ID" 10

  app_preview:
    name: app preview
    needs: [plan, quality]
    if: >-
      needs.quality.result == 'success' &&
      github.event_name == 'pull_request' &&
      needs.plan.outputs.run_app_preview == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    environment:
      name: app-preview
      url: ${{ steps.infrastructure.outputs.entry_url }}
    steps:
      - uses: actions/checkout@v5

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install product dependencies
        run: pnpm install --frozen-lockfile --filter @lymi/web...

      - name: Check preview credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_APP_PREVIEW_TOKEN }}
          LYMI_APP_PREVIEW_AUTH_SECRET: ${{ secrets.LYMI_APP_PREVIEW_AUTH_SECRET }}
        run: |
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_API_TOKEN" || -z "$LYMI_APP_PREVIEW_AUTH_SECRET" ]]; then
            echo "::error::Configure CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_APP_PREVIEW_TOKEN, and LYMI_APP_PREVIEW_AUTH_SECRET in the app-preview environment."
            exit 1
          fi

      - name: Build isolated product preview
        env:
          LYMI_APP_PREVIEW: "1"
        run: pnpm --filter @lymi/web run build

      - name: Prepare isolated preview resources
        id: infrastructure
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_APP_PREVIEW_TOKEN }}
          LYMI_APP_PREVIEW_AUTH_SECRET: ${{ secrets.LYMI_APP_PREVIEW_AUTH_SECRET }}
        run: >-
          node scripts/app-preview-infrastructure.mjs prepare
          "${{ github.event.pull_request.number }}"
          apps/web/dist/lymi/wrangler.json
          apps/web/dist/lymi/wrangler.preview.json
          apps/web/dist/lymi/preview-secrets.json

      - name: Apply preview database migrations
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_APP_PREVIEW_TOKEN }}
        run: >-
          pnpm --filter @lymi/web exec wrangler d1 migrations apply DB --remote
          --config dist/lymi/wrangler.preview.json

      - name: Create app preview Worker
        if: steps.infrastructure.outputs.worker_exists != 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_APP_PREVIEW_TOKEN }}
        run: |
          pnpm --filter @lymi/web exec wrangler deploy \
            --config dist/lymi/wrangler.preview.json \
            --secrets-file dist/lymi/preview-secrets.json \
            --tag "$GITHUB_SHA" \
            --message "Create app preview for PR #${{ github.event.pull_request.number }} at $GITHUB_SHA"

      - name: Upload stable app preview
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_APP_PREVIEW_TOKEN }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-app-output.jsonl
        run: |
          pnpm --filter @lymi/web exec wrangler versions upload \
            --config dist/lymi/wrangler.preview.json \
            --preview-alias preview \
            --secrets-file dist/lymi/preview-secrets.json \
            --tag "$GITHUB_SHA" \
            --message "App preview for PR #${{ github.event.pull_request.number }} at $GITHUB_SHA"

      - name: Record stable app preview
        id: preview
        env:
          APP_PREVIEW_ENTRY_URL: ${{ steps.infrastructure.outputs.entry_url }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-app-output.jsonl
          WORKER_NAME: ${{ steps.infrastructure.outputs.worker_name }}
        run: node scripts/preview-url.mjs "$WRANGLER_OUTPUT_FILE_PATH" "$WORKER_NAME" preview app

      - name: Verify app preview version
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          PREVIEW_VERSION_ID: ${{ steps.preview.outputs.version_id }}
        run: node scripts/check-deployment.mjs "$PREVIEW_URL/api/health" lymi-product "$PREVIEW_VERSION_ID" 10

      - name: Verify preview sign-in and seeded data
        env:
          PREVIEW_ENTRY_URL: ${{ steps.infrastructure.outputs.entry_url }}
        run: node scripts/check-app-preview.mjs

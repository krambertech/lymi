name: Desktop

# The Mac app ships when a merge changes it: built for Apple silicon and Intel, signed, notarized,
# launched, and uploaded to downloads.lymi.app, where installed apps find it within the hour.
# A pull request that changes it launches an unsigned build first. apps/desktop/README.md.
on:
  pull_request:
    paths: [apps/desktop/**, .github/workflows/desktop.yml]
  push:
    branches: [main]
    paths: [apps/desktop/**, .github/workflows/desktop.yml]
  workflow_dispatch:

env:
  WRANGLER: wrangler@4.149.0
  CLOUDFLARE_ACCOUNT_ID: ce6da857aeb521aa2730848a194b8866

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@lymi/desktop..."
      - run: pnpm --filter @lymi/desktop package
      - name: Launch the packaged app
        run: pnpm --filter @lymi/desktop launch-check "$PWD/apps/desktop/out/Lymi-darwin-arm64/Lymi.app"

  release:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    # One release at a time; a newer merge waits for the one before it.
    concurrency:
      group: desktop-release
      cancel-in-progress: false
    env:
      MAC_CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
      MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
    steps:
      - name: Check signing is set up
        id: ready
        run: |
          for name in MAC_CERTIFICATE_P12 MAC_CERTIFICATE_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER CLOUDFLARE_API_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::notice::No release: the $name secret is missing. apps/desktop/README.md lists the setup."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: steps.ready.outputs.ready == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.ready.outputs.ready == 'true'
      - uses: actions/setup-node@v5
        if: steps.ready.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.ready.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile --filter "@lymi/desktop..."

      - name: Put the Developer ID certificate and the notary key on the runner
        if: steps.ready.outputs.ready == 'true'
        run: |
          keychain="$RUNNER_TEMP/lymi.keychain-db"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "" "$keychain"
          echo "$MAC_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MAC_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          printf '%s' "$APPLE_API_KEY" > "$RUNNER_TEMP/notary.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"

      # The run number only grows, so every release is newer than the one installed.
      - name: Build, sign and notarize for both chips
        if: steps.ready.outputs.ready == 'true'
        working-directory: apps/desktop
        env:
          LYMI_SIGN: "1"
        run: |
          npm pkg set version="1.0.${{ github.run_number }}"
          pnpm make --arch=arm64,x64

      - name: Launch the signed app
        if: steps.ready.outputs.ready == 'true'
        run: pnpm --filter @lymi/desktop launch-check "$PWD/apps/desktop/out/Lymi-darwin-arm64/Lymi.app"

      - name: Check Gatekeeper accepts both builds
        if: steps.ready.outputs.ready == 'true'
        run: |
          for arch in arm64 x64; do
            app="apps/desktop/out/Lymi-darwin-$arch/Lymi.app"
            codesign --verify --deep --strict "$app"
            xcrun stapler validate "$app"
            spctl --assess --type execute -vv "$app"
          done

      # The update zip lands before the feed that names it, and the feed before the download button.
      - name: Upload to downloads.lymi.app
        if: steps.ready.outputs.ready == 'true'
        working-directory: apps/desktop/out/make
        run: |
          put() { pnpm dlx "$WRANGLER" r2 object put "lymi-downloads/$1" --file "$2" --remote "${@:3}"; }
          for arch in arm64 x64; do
            zip=$(ls zip/darwin/$arch/*.zip)
            put "darwin/$arch/$(basename "$zip")" "$zip" --content-type application/zip
            put "darwin/$arch/RELEASES.json" "zip/darwin/$arch/RELEASES.json" --content-type application/json --cache-control no-cache
            put "darwin/$arch/Lymi.dmg" "$(ls Lymi-*-$arch.dmg)" --content-type application/x-apple-diskimage --cache-control no-cache
          done

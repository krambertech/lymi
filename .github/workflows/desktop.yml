name: Desktop

# The Mac app ships when a merge changes it: built for Apple silicon and Intel, signed, notarized,
# launched, and uploaded to downloads.lymi.app, where installed apps find it within the hour.
# A pull request that changes it launches an unsigned build first. apps/desktop/README.md.
on:
  pull_request:
    paths: [apps/desktop/**, .github/workflows/desktop.yml]
  push:
    branches: [main]
    paths: [apps/desktop/**, .github/workflows/desktop.yml]
  workflow_dispatch:

env:
  CLOUDFLARE_ACCOUNT_ID: ce6da857aeb521aa2730848a194b8866

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@lymi/desktop..."
      - name: Install dmgbuild, which lays out the download window
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install --quiet dmgbuild==1.6.7
          echo "DMGBUILD=$RUNNER_TEMP/dmgbuild/bin/dmgbuild" >> "$GITHUB_ENV"
      # Makes the DMG as well as the app, so a broken download window fails here, not at release.
      - run: pnpm --filter @lymi/desktop make --arch=arm64
      - name: Launch the packaged app
        run: pnpm --filter @lymi/desktop launch-check "$PWD/apps/desktop/out/Lymi-darwin-arm64/Lymi.app"

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    # One release at a time; a newer merge waits for the one before it.
    concurrency:
      group: desktop-release
      cancel-in-progress: false
    steps:
      - name: Check signing is set up
        id: ready
        env:
          MAC_CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 != '' }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD != '' }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY != '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID != '' }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER != '' }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID != '' }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY != '' }}
        run: |
          for name in MAC_CERTIFICATE_P12 MAC_CERTIFICATE_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER CLOUDFLARE_R2_ACCESS_KEY_ID CLOUDFLARE_R2_SECRET_ACCESS_KEY; do
            if [ "${!name}" != "true" ]; then
              echo "::notice::No release: the $name secret is missing. apps/desktop/README.md lists the setup."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: steps.ready.outputs.ready == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.ready.outputs.ready == 'true'
      - uses: actions/setup-node@v5
        if: steps.ready.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.ready.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile --filter "@lymi/desktop..."
      - name: Install dmgbuild, which lays out the download window
        if: steps.ready.outputs.ready == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install --quiet dmgbuild==1.6.7
          echo "DMGBUILD=$RUNNER_TEMP/dmgbuild/bin/dmgbuild" >> "$GITHUB_ENV"

      - name: Put the Developer ID certificate and the notary key on the runner
        if: steps.ready.outputs.ready == 'true'
        env:
          MAC_CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          keychain="$RUNNER_TEMP/lymi.keychain-db"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "" "$keychain"
          echo "$MAC_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MAC_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          printf '%s' "$APPLE_API_KEY" > "$RUNNER_TEMP/notary.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
          # Shipped builds keep opening after it expires; only new releases need a fresh one.
          expiry=$(security find-certificate -c "Developer ID Application" -p "$keychain" | openssl x509 -noout -enddate | cut -d= -f2)
          if ! security find-certificate -c "Developer ID Application" -p "$keychain" | openssl x509 -noout -checkend $((60 * 86400)) > /dev/null; then
            echo "::warning::The Developer ID certificate expires $expiry. Replace MAC_CERTIFICATE_P12 and its password; apps/desktop/README.md."
          fi

      # The run number only grows, so every release is newer than the one installed.
      - name: Build, sign and notarize for both chips
        if: steps.ready.outputs.ready == 'true'
        working-directory: apps/desktop
        env:
          LYMI_SIGN: "1"
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          npm pkg set version="1.0.${{ github.run_number }}"
          pnpm make --arch=arm64,x64

      # Gatekeeper checks the downloaded DMG itself, so it carries its own ticket.
      - name: Notarize the DMGs
        if: steps.ready.outputs.ready == 'true'
        working-directory: apps/desktop/out/make
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for dmg in Lymi-*.dmg; do
            xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
            xcrun stapler staple "$dmg"
          done

      - name: Launch the signed apps
        if: steps.ready.outputs.ready == 'true'
        run: |
          sudo softwareupdate --install-rosetta --agree-to-license > /dev/null
          for arch in arm64 x64; do
            pnpm --filter @lymi/desktop launch-check "$PWD/apps/desktop/out/Lymi-darwin-$arch/Lymi.app"
          done

      - name: Check Gatekeeper accepts both apps and both DMGs
        if: steps.ready.outputs.ready == 'true'
        run: |
          for arch in arm64 x64; do
            app="apps/desktop/out/Lymi-darwin-$arch/Lymi.app"
            codesign --verify --deep --strict "$app"
            xcrun stapler validate "$app"
            spctl --assess --type execute -vv "$app"
            dmg=$(ls apps/desktop/out/make/Lymi-*-$arch.dmg)
            xcrun stapler validate "$dmg"
            spctl --assess --type open --context context:primary-signature -vv "$dmg"
          done

      # The update zip lands before the feed that names it, and the feed before the download button.
      - name: Upload to downloads.lymi.app
        if: steps.ready.outputs.ready == 'true'
        working-directory: apps/desktop/out/make
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          # R2 rejects the checksums recent AWS CLIs add by default. Cloudflare's R2 docs, aws-cli example.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          put() {
            aws s3 cp "$2" "s3://lymi-downloads/$1" \
              --endpoint-url "https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com" \
              --region auto --only-show-errors "${@:3}"
          }
          for arch in arm64 x64; do
            zip=$(ls zip/darwin/$arch/*.zip)
            put "darwin/$arch/$(basename "$zip")" "$zip" --content-type application/zip
            put "darwin/$arch/RELEASES.json" "zip/darwin/$arch/RELEASES.json" --content-type application/json --cache-control no-cache
            put "darwin/$arch/Lymi.dmg" "$(ls Lymi-*-$arch.dmg)" --content-type application/x-apple-diskimage --cache-control no-cache
          done

name: Phone beta

# Every green merge to main that changes the phone reaches beta installs: an over-the-air update on
# the `beta` branch for each platform, and a `beta` build uploaded to TestFlight or Play's internal
# track when that platform's native fingerprint has no build yet. ADR 0032; docs/phone-release.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One release at a time; a newer merge waits, and replaces any older one still waiting.
concurrency:
  group: phone-beta
  cancel-in-progress: false

env:
  POSTHOG_CLI: "@posthog/cli@0.18.10"
  POSTHOG_CLI_HOST: https://eu.posthog.com
  POSTHOG_CLI_PROJECT_ID: "292417"

jobs:
  setup:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      PHONE_PLATFORMS: ${{ vars.PHONE_PLATFORMS }}
    outputs:
      ready: ${{ steps.eas.outputs.ready }}
      platforms: ${{ steps.eas.outputs.platforms }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Check EAS is set up
        id: eas
        run: node scripts/phone-release.mjs ready

      - uses: pnpm/action-setup@v4
        if: steps.eas.outputs.ready == 'true'

      - uses: actions/setup-node@v5
        if: steps.eas.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        if: steps.eas.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Create the beta and production channels a fresh project lacks
        if: steps.eas.outputs.ready == 'true'
        run: node scripts/phone-release.mjs channels

  # Each platform has its own runtime, update group and build, so one failing leaves the other shipping.
  beta:
    needs: setup
    if: needs.setup.outputs.ready == 'true'
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.setup.outputs.platforms) }}
    name: beta (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Find the update installs have now
        id: latest
        run: node scripts/phone-release.mjs latest beta "$PLATFORM"

      - name: Decide what to release
        id: plan
        env:
          LAST: ${{ steps.latest.outputs.commit }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          paths=(apps/mobile packages/core packages/client packages/design package.json pnpm-lock.yaml
            pnpm-workspace.yaml .pnpmfile.cjs ':!apps/mobile/contract' ':!apps/mobile/e2e' ':!**/*.md'
            ':!**/*.test.ts')
          if [ -n "$LAST" ] && git cat-file -e "$LAST^{commit}" 2>/dev/null; then
            if [ "$LAST" != "$(git rev-parse HEAD)" ] && git merge-base --is-ancestor HEAD "$LAST"; then
              echo "::notice title=Phone beta::A newer commit is already on $PLATFORM beta."
              echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            if [ "$MANUAL" != "true" ] && git diff --quiet "$LAST" HEAD -- "${paths[@]}"; then
              echo "::notice title=Phone beta::Nothing the phone ships changed since the last $PLATFORM beta update."
              echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          {
            echo "release=true"
            echo "message=$(git log -1 --format=%s)"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve the runtime version
        id: runtime
        if: steps.plan.outputs.release == 'true'
        run: node scripts/phone-release.mjs runtime "$PLATFORM"

      - name: Look for a beta build of this runtime
        id: build
        if: steps.plan.outputs.release == 'true'
        run: node scripts/phone-release.mjs has-build "$PLATFORM" beta "${{ steps.runtime.outputs.runtime }}"

      # A new binary embeds this commit, and the update lets earlier ones on the same runtime catch up.
      - name: Build and send to TestFlight or Play's internal track
        if: steps.plan.outputs.release == 'true' && steps.build.outputs.build == 'false'
        run: node scripts/phone-release.mjs build "$PLATFORM" beta

      - name: Publish the update to beta
        if: steps.plan.outputs.release == 'true'
        env:
          MESSAGE: ${{ steps.plan.outputs.message }}
        run: node scripts/phone-release.mjs publish "$PLATFORM" beta preview "$MESSAGE"

      # Hermes stack traces are unreadable without them; uploads match frames by the bundle's chunk ID.
      - name: Upload the update's source maps to PostHog
        if: steps.plan.outputs.release == 'true'
        working-directory: apps/mobile
        env:
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
        run: |
          if [ -z "$POSTHOG_CLI_API_KEY" ]; then
            echo "::warning title=Phone source maps::POSTHOG_CLI_API_KEY is not set, so this update's errors stay unreadable."
            exit 0
          fi
          npx --yes "$POSTHOG_CLI" --host "$POSTHOG_CLI_HOST" hermes upload --directory dist \
            --release-mode event \
            --release-name "$(node -p 'const { expo } = require("./app.json"); process.env.PLATFORM === "ios" ? expo.ios.bundleIdentifier : expo.android.package')" \
            --release-version "$(node -p 'require("./app.json").expo.version')"

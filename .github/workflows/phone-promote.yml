name: Phone promote

# The weekly release: the commit beta installs have been running passes the smoke journey, then each
# platform's update reaches 10% of store installs, and a `production` binary is built for each
# runtime that has none. Phone rollout widens it to everyone a day later. ADR 0032;
# docs/phone-release.md.
on:
  workflow_dispatch:

concurrency:
  group: phone-promote
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      PHONE_PLATFORMS: ${{ vars.PHONE_PLATFORMS }}
    outputs:
      ready: ${{ steps.eas.outputs.ready }}
      groups: ${{ steps.latest.outputs.groups }}
      commit: ${{ steps.latest.outputs.commit }}
    steps:
      - uses: actions/checkout@v5

      - name: Check EAS is set up
        id: eas
        run: node scripts/phone-release.mjs ready

      # eas-cli evaluates app.json, whose config plugins need the app's dependencies.
      - uses: pnpm/action-setup@v4
        if: steps.eas.outputs.ready == 'true'

      - uses: actions/setup-node@v5
        if: steps.eas.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        if: steps.eas.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Create the beta and production channels a fresh project lacks
        if: steps.eas.outputs.ready == 'true'
        run: node scripts/phone-release.mjs channels

      # Stops when a platform has nothing on beta, or the platforms run different commits.
      - name: Find the commit beta installs are running
        id: latest
        if: steps.eas.outputs.ready == 'true'
        run: node scripts/phone-release.mjs candidate

  smoke:
    needs: plan
    if: needs.plan.outputs.ready == 'true'
    uses: ./.github/workflows/phone.yml
    with:
      ref: ${{ needs.plan.outputs.commit }}

  # Each release keeps its frozen API on main, where every Worker change is checked against it,
  # before any learner can run it; a release whose calls changed needs a new version, never a
  # rewritten file.
  contract:
    needs: plan
    if: needs.plan.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.freeze.outputs.version }}
      new: ${{ steps.freeze.outputs.new }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.commit }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Freeze the contract and compare it with the one already frozen
        id: freeze
        run: |
          git fetch --quiet --depth=1 origin main
          pnpm --filter @lymi/mobile contract:freeze
          version=$(node -p 'require("./apps/mobile/app.json").expo.version')
          file="apps/mobile/contract/$version.json"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if ! git cat-file -e "origin/main:$file" 2>/dev/null; then
            echo "new=true" >> "$GITHUB_OUTPUT"
          elif git show "origin/main:$file" | cmp -s - "$file"; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error title=Phone contract::The API release $version calls differs from the one frozen on main. Raise expo.version in apps/mobile/app.json, which an update can carry, merge it, let Phone beta publish it, then promote."
            exit 1
          fi

      - name: Keep the frozen contract
        if: steps.freeze.outputs.new == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: phone-contract
          path: apps/mobile/contract/${{ steps.freeze.outputs.version }}.json

  contract_pull_request:
    needs: [plan, contract]
    if: needs.contract.outputs.new == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
      VERSION: ${{ needs.contract.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The pull request carries the contract alone, whichever branch Promote ran from.
          ref: main
          # The push below authenticates with RELEASE_GITHUB_TOKEN, which a stored token would override.
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: phone-contract
          path: apps/mobile/contract

      # A pull request opened with the workflow's own token would never run CI, so it needs its own.
      # Nothing is published this run; a person merges the pull request once CI checks the Worker
      # against the contract, and the next Promote goes ahead.
      - name: Open the contract's pull request, and stop
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error title=Phone contract::Release $VERSION has no frozen contract on main. RELEASE_GITHUB_TOKEN is not set, so commit the phone-contract artifact from this run, merge it, then promote again."
            exit 1
          fi
          branch="phone/contract-$VERSION"
          existing=$(gh pr list --head "$branch" --state open --json url --jq '.[0].url // ""')
          if [ -n "$existing" ]; then
            echo "::error title=Phone contract::Release $VERSION waits for its contract pull request $existing; promote again once it merges."
            exit 1
          fi
          title="chore(mobile): freeze the phone API contract for $VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add "apps/mobile/contract/$VERSION.json"
          git commit -m "$title"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$branch"
          url=$(gh pr create --base main --head "$branch" --title "$title" \
            --body "Promote run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} froze the API this release calls (ADR 0032).")
          echo "::error title=Phone contract::Release $VERSION has no frozen contract on main yet. Merge $url once CI is green, then promote again."
          exit 1

  promote:
    needs: [plan, smoke, contract]
    if: needs.contract.outputs.new == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Promote, rollout and rollback all change production, so they take turns.
    concurrency:
      group: phone-production
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      GROUPS: ${{ needs.plan.outputs.groups }}
      COMMIT: ${{ needs.plan.outputs.commit }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.commit }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Re-checks every platform's beta and production before republishing any. The same files beta
      # ran, so beta's source maps cover them.
      - name: Republish each platform's update to production at 10%
        id: promote
        run: node scripts/phone-release.mjs promote "$COMMIT" "$GROUPS"

      # Uploaded to App Store Connect and Play's closed testing track; sending a version for review
      # or promoting it to Play's production track stays a person's call.
      - name: Build each runtime that has no production binary
        if: steps.promote.outputs.promoted == 'true'
        run: node scripts/phone-release.mjs build-missing production "$GROUPS"

name: Phone promote

# The weekly release: the update TestFlight has been running passes the smoke journey, then reaches
# 10% of App Store installs, and a `production` binary is built when its runtime has none. Phone
# rollout widens it to everyone a day later. ADR 0032; docs/phone-release.md.
on:
  workflow_dispatch:

concurrency:
  group: phone-promote
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    outputs:
      ready: ${{ steps.eas.outputs.ready }}
      group: ${{ steps.latest.outputs.group }}
      runtime: ${{ steps.latest.outputs.runtime }}
      commit: ${{ steps.latest.outputs.commit }}
    steps:
      - uses: actions/checkout@v5

      - name: Check EAS is set up
        id: eas
        run: node scripts/phone-release.mjs ready

      - name: Create the beta and production channels a fresh project lacks
        if: steps.eas.outputs.ready == 'true'
        run: node scripts/phone-release.mjs channels

      - name: Find the update TestFlight is running
        id: latest
        if: steps.eas.outputs.ready == 'true'
        run: |
          node scripts/phone-release.mjs latest beta
          if ! grep -q '^group=.\+' "$GITHUB_OUTPUT"; then
            echo "::error title=Phone promote::Nothing is published on beta yet."; exit 1
          fi

  smoke:
    needs: plan
    if: needs.plan.outputs.ready == 'true'
    uses: ./.github/workflows/phone.yml
    with:
      ref: ${{ needs.plan.outputs.commit }}

  # Each release keeps its frozen API for as long as it is supported, so a release whose calls
  # changed needs a new version before it ships, never a rewritten file.
  contract:
    needs: plan
    if: needs.plan.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.freeze.outputs.version }}
      new: ${{ steps.freeze.outputs.new }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.commit }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Freeze the contract and compare it with the one already frozen
        id: freeze
        run: |
          git fetch --quiet --depth=1 origin main
          pnpm --filter @lymi/mobile contract:freeze
          version=$(node -p 'require("./apps/mobile/app.json").expo.version')
          file="apps/mobile/contract/$version.json"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          new=true
          for ref in origin/main HEAD; do
            git cat-file -e "$ref:$file" 2>/dev/null || continue
            if ! git show "$ref:$file" | cmp -s - "$file"; then
              echo "::error title=Phone contract::The API release $version calls differs from the one frozen on $ref. Raise expo.version in apps/mobile/app.json, which an update can carry, and promote again."
              exit 1
            fi
            new=false
          done
          echo "new=$new" >> "$GITHUB_OUTPUT"

      - name: Keep the frozen contract
        if: steps.freeze.outputs.new == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: phone-contract
          path: apps/mobile/contract/${{ steps.freeze.outputs.version }}.json

  promote:
    needs: [plan, smoke, contract]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Promote, rollout and rollback all change production, so they take turns.
    concurrency:
      group: phone-production
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      GROUP: ${{ needs.plan.outputs.group }}
      RUNTIME: ${{ needs.plan.outputs.runtime }}
      COMMIT: ${{ needs.plan.outputs.commit }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.commit }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Re-checks beta and production first. The same files TestFlight ran, so beta's source maps cover them.
      - name: Republish the update to production at 10%
        id: promote
        run: node scripts/phone-release.mjs promote "$GROUP" "$COMMIT"

      - name: Look for a production build of this runtime
        id: build
        if: steps.promote.outputs.promoted == 'true'
        run: node scripts/phone-release.mjs has-build production "$RUNTIME"

      # Uploaded to App Store Connect; submitting the version for review stays a person's call.
      - name: Build for the App Store
        if: steps.build.outputs.build == 'false'
        run: node scripts/phone-release.mjs build production

  contract_pull_request:
    needs: [plan, contract, promote]
    if: needs.contract.outputs.new == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
      VERSION: ${{ needs.contract.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The push below authenticates with RELEASE_GITHUB_TOKEN, which a stored token would override.
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: phone-contract
          path: apps/mobile/contract

      # A pull request opened with the workflow's own token would never run CI, so it needs its own.
      - name: Open a pull request that merges itself once green
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning title=Phone contract::RELEASE_GITHUB_TOKEN is not set; commit the phone-contract artifact from this run by hand."
            exit 0
          fi
          branch="phone/contract-$VERSION-${GITHUB_RUN_ID}"
          title="chore(mobile): freeze the phone API contract for $VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add "apps/mobile/contract/$VERSION.json"
          git commit -m "$title"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$branch"
          url=$(gh pr create --base main --head "$branch" --title "$title" \
            --body "Promote run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} froze the API this release calls (ADR 0032).")
          gh pr merge "$url" --auto --squash

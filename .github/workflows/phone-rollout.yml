name: Phone rollout

# A promoted update reaches 10% of App Store installs first, and everyone a day later unless Phone
# rollback reverted it. docs/phone-release.md.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: phone-production
  cancel-in-progress: false

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Check EAS is set up
        id: eas
        run: node scripts/phone-release.mjs ready

      # eas-cli evaluates app.json, whose config plugins need the app's dependencies.
      - uses: pnpm/action-setup@v4
        if: steps.eas.outputs.ready == 'true'

      - uses: actions/setup-node@v5
        if: steps.eas.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        if: steps.eas.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Create the beta and production channels a fresh project lacks
        if: steps.eas.outputs.ready == 'true'
        run: node scripts/phone-release.mjs channels

      - name: Widen a rollout that has had its day
        if: steps.eas.outputs.ready == 'true'
        run: node scripts/phone-release.mjs finish-rollout production 24

# Do not merge. Finds which end-of-review effect stalls WebKit on Linux CI.
name: WebKit end screen experiment

on:
  push:
    branches: [kateryna/do-not-merge-webkit-end-screen-experiment]

jobs:
  webkit:
    name: webkit (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: fix-test
            target: e2e/review-complete.spec.ts:49
            repeat: 8
          - variant: fix-spec
            target: e2e/review-complete.spec.ts
            repeat: 3
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps --only-shell webkit

      - name: Run with the shared test's blur override
        run: pnpm exec playwright test ${{ matrix.target }} --project=webkit --repeat-each=${{ matrix.repeat }} --retries=0 --trace=retain-on-failure --reporter=list,html

      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: report-${{ matrix.variant }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 3

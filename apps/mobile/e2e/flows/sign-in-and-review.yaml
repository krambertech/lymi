# The phone's smoke journey: sign in with a password, grade three cards, end the review.
# run.sh seeds the learner persona first and checks afterwards that the grades reached the Worker.
appId: app.lymi
name: Sign in and review
---
- launchApp:
    clearState: true
    clearKeychain: true
- tapOn: "Sign in with email"
- tapOn:
    id: "email"
- inputText: ${EMAIL}
- tapOn:
    id: "password"
- inputText: ${PASSWORD}
- tapOn: "^Sign in$"
# iOS may offer to save the password, and Today stays hidden under the offer until it closes.
- extendedWaitUntil:
    visible: "Not Now|^Review$"
    timeout: 30000
- tapOn:
    text: "Not Now"
    optional: true
- assertVisible: "^Review$"
- tapOn: "^Review$"
- repeat:
    times: 3
    commands:
      - tapOn: ".*Tap to reveal"
      - tapOn: "^Good$"
# Ending short of the goal goes straight back to Today.
- tapOn: "End review"
- assertVisible: "cards due today"

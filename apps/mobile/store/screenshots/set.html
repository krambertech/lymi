<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  /* The nine store screenshots, side by side on one stage. set.mjs sets the query (lang, size) and clips each panel. */
  @font-face {
    font-family: "Onest";
    src: url("../../../../node_modules/.pnpm/@fontsource-variable+onest@5.3.1/node_modules/@fontsource-variable/onest/files/onest-latin-wght-normal.woff2") format("woff2");
    font-weight: 100 900;
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2212;
  }
  @font-face {
    font-family: "Onest";
    src: url("../../../../node_modules/.pnpm/@fontsource-variable+onest@5.3.1/node_modules/@fontsource-variable/onest/files/onest-latin-ext-wght-normal.woff2") format("woff2");
    font-weight: 100 900;
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
  @font-face {
    font-family: "Onest";
    src: url("../../../../node_modules/.pnpm/@fontsource-variable+onest@5.3.1/node_modules/@fontsource-variable/onest/files/onest-cyrillic-wght-normal.woff2") format("woff2");
    font-weight: 100 900;
    unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
  }
  @font-face {
    font-family: "Onest";
    src: url("../../../../node_modules/.pnpm/@fontsource-variable+onest@5.3.1/node_modules/@fontsource-variable/onest/files/onest-vietnamese-wght-normal.woff2") format("woff2");
    font-weight: 100 900;
    unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;
  }
  :root {
    --night: #120f0c;
    --plate: #231e1a;
    --plate-2: #2b2722;
    --edge: #ffffff14;
    --ivory: #f1eee7;
    --ivory-2: #c3bdb4;
    --ivory-3: #a59d94;
    --amber: #fdb443;
    --amber-ink: #2b1401;
    --amber-text: #f9bf60;
    --ink: #1c140f;
    --ink-2: #49403a;
    --ink-3: #72665f;
    --sans: "Onest", "Hiragino Sans", "Apple SD Gothic Neo", "PingFang SC", "Noto Sans Georgian", "Geeza Pro", "Kohinoor Devanagari", system-ui, sans-serif;
    --W: 1320px;
    --H: 2868px;
    /* Google Play takes 9:16 only, so a Play panel is wider and shorter; the shot is scaled to its height. */
    --PW: var(--W);
    --PH: var(--H);
  }
  [data-size="play"] { --PW: 1440px; --PH: 2560px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: calc(var(--PW) * var(--n, 9)); height: var(--PH); overflow: hidden; background: var(--night); }
  body { font-family: var(--sans); color: var(--ivory); -webkit-font-smoothing: antialiased; position: relative; }
  .panel { position: absolute; top: 0; width: var(--PW); height: var(--PH); overflow: hidden; background: var(--night); }
  .shot { position: absolute; top: 0; left: 50%; width: var(--W); height: var(--H); margin-left: calc(var(--W) / -2); transform-origin: top center; }
  [data-size="play"] .shot { scale: 0.8926; }
  .abs { position: absolute; }

  /* Lantern light pooled in the dark room. */
  .pool { position: absolute; border-radius: 50%; background: radial-gradient(closest-side, #fdb44352, #f0a73224 45%, transparent); }

  /* Headline and the plain line under it. */
  .copy { position: absolute; left: 110px; width: 1100px; top: 200px; z-index: 10; }
  .copy.bottom { top: auto; bottom: 190px; }
  .copy.center { text-align: center; }
  .copy h1 { font-size: 148px; font-weight: 650; line-height: 1.0; letter-spacing: -0.035em; text-wrap: balance; }
  .copy h1 em { font-style: normal; color: var(--amber); }
  .copy p { margin-top: 44px; font-size: 54px; font-weight: 450; line-height: 1.28; letter-spacing: -0.01em; color: var(--ivory-2); max-width: 26ch; text-wrap: pretty; }
  .copy.center p { margin-inline: auto; }

  /* An iPhone drawn around a raw Simulator capture. */
  .phone {
    position: absolute; width: var(--pw); padding: calc(var(--pw) * 0.03); border-radius: calc(var(--pw) * 0.16);
    background: #0d0c0b; filter: drop-shadow(0 60px 120px #000c);
    box-shadow: inset 0 0 0 calc(var(--pw) * 0.004) #4a4541, 0 0 0 calc(var(--pw) * 0.006) #6f6a65, 0 0 0 calc(var(--pw) * 0.009) #2b2826;
  }
  .phone img.screen { display: block; width: 100%; border-radius: calc(var(--pw) * 0.13); }
  .phone::before { content: ""; position: absolute; left: 50%; translate: -50% 0; top: calc(var(--pw) * 0.052); width: calc(var(--pw) * 0.27); height: calc(var(--pw) * 0.079); background: #000; border-radius: 999px; }
  .phone i { position: absolute; width: calc(var(--pw) * 0.012); background: #3a3633; border-radius: 4px; }
  .phone i.a { left: calc(var(--pw) * -0.017); top: 19%; height: 4%; }
  .phone i.b { left: calc(var(--pw) * -0.017); top: 26%; height: 7.5%; }
  .phone i.c { left: calc(var(--pw) * -0.017); top: 35%; height: 7.5%; }
  .phone i.d { right: calc(var(--pw) * -0.017); top: 28%; height: 11%; }

  /* A piece of a capture lifted out of the phone, a little larger. */
  .callout { position: absolute; background-repeat: no-repeat; background-color: #fff; box-shadow: 0 50px 120px -10px #000000d9, 0 0 0 2px #ffffff14; }

  /* Plates, cards and notes drawn in the app's own type and colours. */
  .np { position: absolute; background: var(--plate); color: var(--ivory); border-radius: 72px; box-shadow: 0 0 0 2px #ffffff12, 0 60px 120px -20px #000000d9; }
  .muted { color: var(--ivory-3); }
  .fc { position: absolute; background: #fff; color: var(--ink); border-radius: 56px; padding: 54px 60px; box-shadow: 0 50px 100px -20px #000000e6; }
  .fc .d { font-size: 34px; color: var(--ink-3); }
  .fc .t { font-size: 84px; font-weight: 600; letter-spacing: -0.03em; margin-top: 26px; line-height: 1.05; }
  .fc .a { font-size: 46px; color: var(--ink-2); margin-top: 18px; padding-top: 22px; border-top: 3px solid #2013081a; }
  .fc .r { display: block; font-size: 0.36em; color: var(--ink-2); font-weight: 450; letter-spacing: 0.02em; }
  .note { position: absolute; display: flex; align-items: center; gap: 28px; padding: 30px 54px 30px 30px; border-radius: 999px; background: var(--amber); color: var(--amber-ink); font-size: 50px; font-weight: 600; white-space: nowrap; z-index: 9; box-shadow: 0 40px 80px -20px #000000cc, 0 0 90px #fdb44366; }
  .note .dot { width: 116px; height: 116px; border-radius: 50%; background: var(--plate-2); display: grid; place-items: center; overflow: hidden; flex: none; }
  .mk { border-radius: 50%; background: var(--plate); display: grid; place-items: center; flex: none; }
  .face { position: absolute; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 12px var(--night), 0 40px 80px -10px #000000cc; }
  .face svg { width: 100%; height: 100%; display: block; }
  .tag { position: absolute; display: flex; align-items: center; gap: 14px; padding: 18px 34px; border-radius: 999px; background: var(--plate-2); font-size: 42px; font-weight: 550; white-space: nowrap; box-shadow: 0 0 0 2px var(--edge); z-index: 7; }
  .bubble { border-radius: 52px; padding: 40px 52px; font-size: 52px; line-height: 1.3; }

  /* Ready decks: languages in their own scripts, then the subjects. */
  .langs { position: absolute; display: grid; gap: 40px; rotate: -8deg; }
  .langs div { display: flex; gap: 46px; align-items: baseline; white-space: nowrap; }
  .langs span { font-weight: 600; letter-spacing: -0.02em; color: var(--ivory); }
  .langs span.dim { color: #635c56; }
  .langs span.lit { color: var(--amber); text-shadow: 0 0 60px #fdb44399; }
  .topics { position: absolute; display: grid; gap: 26px; rotate: -8deg; }
  .topics div { display: flex; gap: 22px; white-space: nowrap; }
  .topic { display: inline-flex; align-items: center; gap: 24px; padding: 34px 52px 34px 34px; border-radius: 999px; background: var(--plate); font-size: 52px; font-weight: 550; box-shadow: 0 0 0 2px #ffffff12; }
  .topic.lit { background: var(--amber); color: var(--amber-ink); font-weight: 650; padding-inline: 56px; box-shadow: 0 0 80px -10px #fdb44399; }
  .topic i { width: 54px; height: 54px; border-radius: 16px; display: block; }

  /* Smart add: a textbook page in the camera's frame, and the terms picked from it. */
  .page { position: absolute; background: #f7f2e8; color: #2a2118; border-radius: 18px; padding: 80px 90px; font-family: Georgia, "Times New Roman", serif; box-shadow: 0 60px 120px -20px #000000e6; }
  .page h3 { font-size: 64px; font-weight: 700; letter-spacing: -0.01em; }
  .page h4 { font-size: 36px; font-weight: 400; letter-spacing: 0.14em; text-transform: uppercase; color: #8a7a66; margin: 40px 0 26px; }
  .page li { list-style: none; font-size: 46px; line-height: 1.75; }
  .page mark { background: linear-gradient(transparent 18%, #fdb44399 18%, #fdb44399 88%, transparent 88%); color: inherit; padding-inline: 6px; }
  .page .gl { color: #6d5e4e; }
  .frame { position: absolute; border: 0 solid var(--amber); width: 120px; height: 120px; }
  .pick { display: flex; align-items: center; gap: 40px; padding: 34px 0; border-top: 2px solid #ffffff12; }
  .pick:first-of-type { border-top: 0; }
  .pick .box { width: 72px; height: 72px; border-radius: 22px; background: var(--amber); display: grid; place-items: center; flex: none; }
  .pick .tm { font-size: 58px; font-weight: 600; letter-spacing: -0.02em; }
  .pick .mn { font-size: 42px; color: var(--ivory-3); margin-top: 2px; }

  /* Audio */
  .wave { display: flex; align-items: center; gap: 18px; }
  .wave i { width: 22px; border-radius: 11px; background: var(--amber); }
  .play { width: 260px; height: 260px; border-radius: 50%; background: var(--amber); display: grid; place-items: center; box-shadow: 0 0 120px #fdb44380; flex: none; }
  .chip { display: inline-flex; padding: 26px 44px; border-radius: 999px; background: var(--plate-2); font-size: 46px; font-weight: 500; box-shadow: 0 0 0 2px var(--edge); }

  /* Import */
  .file { position: absolute; width: 560px; padding: 56px 60px; border-radius: 56px; background: var(--plate-2); box-shadow: 0 0 0 2px #ffffff14, 0 50px 100px -20px #000000cc; }
  .file .nm { font-size: 64px; font-weight: 650; letter-spacing: -0.02em; }
  .file .mt { font-size: 42px; color: var(--ivory-3); margin-top: 8px; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="art.js"></script>
<script src="copy.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  const lang = q.get("lang") ?? "en";
  document.documentElement.lang = lang;
  document.documentElement.dataset.size = q.get("size") ?? "iphone";
  const T = COPY[lang];
  const W = 1320, H = 2868;
  const raw = (name) => `raw/${lang}/${name}.png`;
  const brand = "../../../site/public/brand/";
  const stage = document.getElementById("stage");

  const el = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; };
  let shot;
  const add = (html) => { const node = el(html); shot.append(node); return node; };

  function panel(k) {
    const p = el(`<div class="panel" style="left:calc(var(--PW) * ${k})"><div class="shot"></div></div>`);
    stage.append(p);
    shot = p.firstChild;
  }
  function text(i, { pos = "" } = {}) {
    const [h, p] = T.shots[i];
    add(`<div class="copy ${pos}"><h1>${h}</h1><p>${p}</p></div>`);
  }
  const pool = (x, y, size) => add(`<div class="pool" style="left:${x}px;top:${y}px;width:${size}px;height:${size}px"></div>`);
  function phone(src, { pw = 960, x = (W - pw) / 2, y = 900, rot = 0, z = 2 } = {}) {
    const node = add(`<div class="phone" style="--pw:${pw}px;left:${x}px;top:${y}px;rotate:${rot}deg;z-index:${z}"><img class="screen" src="${src}"><i class="a"></i><i class="b"></i><i class="c"></i><i class="d"></i></div>`);
    return { src, pw, x, y, rot, node };
  }
  /** Lifts crop [cx, cy, cw, ch] (raw pixels) out of the phone's screen at scale s, centred where it sits. */
  function callout(ph, [cx, cy, cw, ch], { s = 1, rot = 0, dx = 0, dy = 0, r = 56, z = 3, bg = "#fff" } = {}) {
    const k = (ph.pw * 0.94) / W;
    const phoneH = ph.pw * 0.06 + ph.pw * 0.94 * (H / W);
    const pcx = ph.x + ph.pw / 2, pcy = ph.y + phoneH / 2;
    let ox = ph.x + ph.pw * 0.03 + (cx + cw / 2) * k - pcx;
    let oy = ph.y + ph.pw * 0.03 + (cy + ch / 2) * k - pcy;
    const a = (ph.rot * Math.PI) / 180;
    [ox, oy] = [ox * Math.cos(a) - oy * Math.sin(a), ox * Math.sin(a) + oy * Math.cos(a)];
    return add(`<div class="callout" style="left:${pcx + ox - (cw * s) / 2 + dx}px;top:${pcy + oy - (ch * s) / 2 + dy}px;width:${cw * s}px;height:${ch * s}px;background-image:url(${ph.src});background-size:${W * s}px auto;background-position:${-cx * s}px ${-cy * s}px;rotate:${ph.rot + rot}deg;border-radius:${r}px;z-index:${z};background-color:${bg}"></div>`);
  }
  const fcard = ({ x, y, w = 520, rot = 0, deck, term, answer, scale = 1, z = 4 }) =>
    add(`<div class="fc" style="left:${x}px;top:${y}px;width:${w}px;rotate:${rot}deg;scale:${scale};z-index:${z}"><div class="d">${deck}</div><div class="t">${term}</div><div class="a">${answer}</div></div>`);
  const mark = (name, size) => {
    const m = ART.marks[name];
    return `<svg viewBox="0 0 24 24" width="${size}" height="${size}"><path d="${m.path}" fill-rule="${name === "Grok Bot" ? "evenodd" : "nonzero"}" fill="${m.color ?? "#f1eee7"}"/></svg>`;
  };
  const check = `<svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="#2b1401" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;
  const speaker = (size, color, fill) => `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linecap="round"><path d="M11 5 6 9H3v6h3l5 4z" ${fill ? `fill="${color}"` : ""}/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>`;

  // Raw crops, [x, y, width, height] in capture pixels.
  const crop = { kanji: [40, 390, 330, 220] };

  const shots = [
    // 1 · Learn anything: the lantern over a review, cards from four kinds of subject around it.
    () => {
      pool(80, 520, 1500);
      add(`<img class="abs" src="${brand}lantern-dark.svg" style="width:620px;left:600px;top:820px;z-index:1">`);
      text(0);
      phone(raw("02-review"), { pw: 860, x: 230, y: 1560, rot: -6 });
      const [geo, jp, chem, drive] = T.hero;
      fcard({ x: 40, y: 1220, w: 480, rot: -11, scale: 0.84, z: 3, ...geo });
      fcard({ x: 840, y: 1400, w: 420, rot: 9, ...jp, term: `<span class="r">てんき</span>天気` });
      fcard({ x: -40, y: 1820, w: 420, rot: 6, scale: 0.8, ...chem });
      fcard({ x: 800, y: 2300, w: 560, rot: -7, scale: 0.8, ...drive });
    },
    // 2 · Works with your AI: the phone up top, the assistants in one row across it, the words at the foot.
    () => {
      pool(-150, 300, 1620);
      phone(raw("05-library"), { pw: 940, x: 190, y: 130, rot: 3, z: 2 });
      add(`<div class="note" style="left:140px;top:1180px;rotate:-3deg"><span class="dot">${mark("Claude", 70)}</span>${T.ai.note}</div>`);
      const names = [["Claude", "#d97757"], ["ChatGPT", "#f1eee7"], ["Gemini", "#3186ff"], ["Grok", "#f1eee7"], ["Grok Bot", "#f1eee7"], ["Other apps", "#fdb443"]];
      add(`<div class="abs" style="left:40px;top:1640px;width:1240px;height:300px;border-radius:150px;background:#1a1613;box-shadow:0 0 0 2px #ffffff14, 0 60px 120px -20px #000;rotate:-4deg;z-index:6;display:flex;align-items:center;justify-content:space-evenly;padding-inline:20px">
        ${names.map(([n, glow]) => `<div class="mk" style="width:184px;height:184px;box-shadow:0 0 0 2px #ffffff1a, 0 0 80px -6px ${glow}aa">${mark(n, 98)}</div>`).join("")}</div>`);
      text(1, { pos: "bottom" });
    },
    // 3 · Ready decks: no phone; the languages in their own scripts and the subjects people study for.
    () => {
      text(2);
      pool(-300, 700, 1800);
      add(`<div class="langs" style="left:-380px;top:930px;width:2080px">
        ${T.decks.langs.map((r, k) => `<div style="margin-left:${[60, -120, 30, -80, 0][k]}px">${r.map(([w, size, c]) => `<span class="${c ?? ""}" style="font-size:${size}px">${w}</span>`).join("")}</div>`).join("")}</div>`);
      const tray = ["#f2b8a0", "#b9d3a6", "#c9b8f0", "#9cc5e8", "#e8a6b8", "#d8c79a"];
      let t = 0;
      add(`<div class="topics" style="left:-260px;top:2200px;width:1900px">
        ${T.decks.topics.map((r, k) => `<div style="margin-left:${[380, -60, 200, 40][k]}px">${r.map((n) => (n.startsWith("*") ? `<span class="topic lit">${n.slice(1)}</span>` : `<span class="topic"><i style="background:${tray[t++ % tray.length]}"></i>${n}</span>`)).join("")}</div>`).join("")}</div>`);
    },
    // 4 · Smart add: a textbook page in the camera's frame, and the terms picked from it.
    () => {
      text(3);
      pool(-200, 900, 1700);
      const s = T.smart;
      add(`<div class="page" style="left:120px;top:900px;width:960px;height:1120px;rotate:-5deg;z-index:2">
        <h3>Lezione 15 · In città</h3><h4>${s.vocab}</h4>
        <ul>${s.lines.map(([w, g, hi]) => `<li>${hi ? `<mark>${w}</mark>` : w} <span class="gl">— ${g}</span></li>`).join("")}</ul></div>`);
      [[110, 860, "border-top-width:12px;border-left-width:12px;border-top-left-radius:40px"], [1010, 800, "border-top-width:12px;border-right-width:12px;border-top-right-radius:40px"]].forEach(([x, y, b]) => {
        add(`<div class="frame" style="left:${x}px;top:${y}px;${b};rotate:-5deg;z-index:3"></div>`);
      });
      add(`<div class="np" style="left:170px;top:1720px;width:1040px;padding:40px 70px 56px;z-index:5">
        ${s.picked.map(([w, m]) => `<div class="pick"><span class="box">${check}</span><div><div class="tm">${w}</div><div class="mn">${m}</div></div></div>`).join("")}
        <div style="margin-top:34px;height:150px;border-radius:999px;background:var(--amber);color:var(--amber-ink);display:grid;place-items:center;font-size:56px;font-weight:650">${s.button}</div></div>`);
    },
    // 5 · Learn together: one lit shared deck, cards spilling out, friends arriving around it.
    () => {
      text(4);
      pool(-250, 950, 1820);
      const g = T.together;
      add(`<div class="bubble" style="position:absolute;left:520px;top:860px;max-width:680px;background:var(--amber);color:var(--amber-ink);font-weight:550;rotate:3deg;z-index:8;box-shadow:0 30px 70px -20px #000c">${g.bubble}</div>`);
      add(`<div class="abs" style="left:210px;top:1500px;width:900px;rotate:-5deg;z-index:3">
        <div style="position:relative;height:560px;border-radius:64px 64px 0 0;background:linear-gradient(160deg,#f0b072,#d98a45)">
          ${g.cards.map(([deck, term, answer], k) => `<div class="fc" style="left:${[40, 450, 230][k]}px;top:${[-230, -250, -20][k]}px;width:${[420, 420, 440][k]}px;rotate:${[-13, 11, -2][k]}deg;padding:40px 46px"><div class="d">${deck}</div><div class="t" style="font-size:${k === 2 ? 72 : 66}px;white-space:nowrap">${term}</div><div class="a" style="font-size:36px">${answer}</div></div>`).join("")}
        </div>
        <div style="border-radius:0 0 64px 64px;background:var(--plate);padding:50px 60px;box-shadow:0 0 0 2px #ffffff12, 0 60px 120px -20px #000000e6">
          <div style="font-size:76px;font-weight:650;letter-spacing:-0.03em">Italiano A2</div>
          <div class="muted" style="font-size:42px;margin-top:6px">${g.deck}</div></div></div>`);
      [["joining", 10, 1760, 280, -8, "#e8a6b8"], ["polyglot", 880, 1770, 290, 7, "#c9b8f0"], ["streak", 120, 2400, 260, -4, "#f2b8a0"], ["fresh", 850, 2450, 250, 6, "#b9d3a6"]].forEach(([id, x, y, size, rot, glow], k) => {
        add(`<div class="abs" style="left:${x - 80}px;top:${y - 80}px;width:${size + 160}px;height:${size + 160}px;border-radius:50%;background:radial-gradient(closest-side, ${glow}66, transparent);z-index:5"></div>`);
        add(`<div class="face" style="left:${x}px;top:${y}px;width:${size}px;height:${size}px;rotate:${rot}deg;z-index:6">${ART.avatars[id]}</div>`);
        // Tags on the right hang from the face's right edge, so a long translation grows inward.
        const side = x > W / 2 ? `right:${Math.max(40, W - x - size * 0.95)}px` : `left:${x + size * 0.15}px`;
        add(`<div class="tag" style="${side};top:${y + size - 30}px;rotate:${-rot / 2}deg"><span style="width:20px;height:20px;border-radius:50%;background:#7fd39f"></span>${g.joined[k]}</div>`);
      });
    },
    // 6 · Hear every word: the card and its voice up top, the words at the foot.
    () => {
      pool(-200, 300, 1700);
      const a = T.audio;
      const bars = [40, 90, 150, 220, 300, 260, 380, 300, 200, 330, 420, 340, 240, 160, 260];
      add(`<div class="np" style="left:110px;top:170px;width:1100px;padding:90px;z-index:3">
        <div class="muted" style="font-size:42px">${a.deck}</div>
        <div style="font-size:150px;font-weight:600;letter-spacing:-0.035em;margin-top:80px">la lampada</div>
        <div class="muted" style="font-size:58px;margin-top:10px">${a.meaning}</div>
        <div style="display:flex;align-items:center;gap:60px;margin-top:90px"><div class="play">${speaker(120, "#2b1401", true)}</div>
          <div class="wave">${bars.map((h) => `<i style="height:${h * 0.7}px"></i>`).join("")}</div></div>
        <div style="height:2px;background:#ffffff12;margin:100px 0 64px"></div>
        <div class="muted" style="font-size:40px">${a.example}</div>
        <div style="font-size:60px;margin-top:14px;line-height:1.3">Accendi la lampada, per favore.</div>
        <div style="display:flex;align-items:center;gap:24px;margin-top:40px;font-size:42px;color:var(--amber-text)">${speaker(56, "#f9bf60")}${a.play}</div></div>`);
      add(`<div class="abs" style="left:110px;width:1100px;top:1930px;display:flex;flex-wrap:wrap;gap:20px;justify-content:center;z-index:3">${a.langs.map((l) => `<span class="chip">${l}</span>`).join("")}</div>`);
      text(5, { pos: "bottom" });
    },
    // 7 · Learning Japanese: the card page, its kanji lifted out large with the reading over it.
    () => {
      text(6);
      pool(-100, 1000, 1500);
      const ph = phone(raw("04-japanese"), { pw: 880, x: 340, y: 1120, rot: 5 });
      callout(ph, crop.kanji, { s: 2.7, rot: -8, dx: 30, dy: -280, r: 72 });
    },
    // 8 · Switching from Anki: other apps' decks falling into one lit deck.
    () => {
      text(7);
      const m = T.import;
      [["Anki", m.counts[0], 70, 980, -9], ["Quizlet", m.counts[1], 690, 1060, 8], ["Mochi", m.counts[2], 90, 1420, 5], ["Pleco", m.counts[3], 700, 1490, -6]].forEach(([n, c, x, y, r]) => {
        add(`<div class="file" style="left:${x}px;top:${y}px;rotate:${r}deg"><div class="nm">${n}</div><div class="mt">${c}</div></div>`);
      });
      pool(-150, 1600, 1620);
      add(`<svg class="abs" style="left:560px;top:1920px" width="200" height="200" viewBox="0 0 24 24" fill="none" stroke="#fdb443" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v15M6 13l6 6 6-6"/></svg>`);
      add(`<div class="np" style="left:110px;top:2200px;width:1100px;padding:80px 90px;display:flex;align-items:center;gap:50px">
        <img src="${brand}lantern-dark.svg" width="190" height="190">
        <div><div style="font-size:76px;font-weight:650;letter-spacing:-0.03em">${m.title}</div>
        <div class="muted" style="font-size:46px;margin-top:6px">${m.sub}</div></div></div>`);
    },
    // 9 · Keep the flame lit: two phones, the day and the run of days.
    () => {
      text(8, { pos: "center" });
      pool(-150, 900, 1620);
      phone(raw("01-today"), { pw: 760, x: 20, y: 1200, rot: -8, z: 2 });
      phone(raw("06-streak"), { pw: 800, x: 470, y: 1000, rot: 6, z: 3 });
    },
  ];

  const only = q.get("only");
  const list = only ? only.split(",").map(Number) : shots.map((_, i) => i);
  window.PANELS = list.length;
  document.documentElement.style.setProperty("--n", list.length);
  list.forEach((i, k) => { panel(k); shots[i](); });
  // A long translation shrinks until each word fits the line and the headline keeps to three lines; set.mjs calls it once Onest has loaded.
  window.fit = () => {
    for (const h of document.querySelectorAll(".copy h1")) {
      let size = Number.parseFloat(getComputedStyle(h).fontSize);
      while ((h.scrollWidth > h.clientWidth + 1 || h.getBoundingClientRect().height > size * 3 + 1) && size > 90) {
        size -= 4;
        h.style.fontSize = `${size}px`;
      }
    }
  };
</script>
</body>
</html>

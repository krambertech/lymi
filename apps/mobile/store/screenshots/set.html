<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  /* The nine store screenshots, side by side on one stage. set.mjs sets the query (lang, size) and clips each panel. */
  @font-face {
    font-family: "Onest";
    src: url("../../../../node_modules/.pnpm/@fontsource-variable+onest@5.3.1/node_modules/@fontsource-variable/onest/files/onest-latin-wght-normal.woff2") format("woff2");
    font-weight: 100 900;
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2212;
  }
  @font-face {
    font-family: "Onest";
    src: url("../../../../node_modules/.pnpm/@fontsource-variable+onest@5.3.1/node_modules/@fontsource-variable/onest/files/onest-latin-ext-wght-normal.woff2") format("woff2");
    font-weight: 100 900;
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
  @font-face {
    font-family: "Onest";
    src: url("../../../../node_modules/.pnpm/@fontsource-variable+onest@5.3.1/node_modules/@fontsource-variable/onest/files/onest-cyrillic-wght-normal.woff2") format("woff2");
    font-weight: 100 900;
    unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
  }
  @font-face {
    font-family: "Onest";
    src: url("../../../../node_modules/.pnpm/@fontsource-variable+onest@5.3.1/node_modules/@fontsource-variable/onest/files/onest-vietnamese-wght-normal.woff2") format("woff2");
    font-weight: 100 900;
    unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;
  }
  :root {
    --night: #120f0c;
    --plate: #231e1a;
    --plate-2: #2b2722;
    --edge: #ffffff14;
    --ivory: #f1eee7;
    --ivory-2: #c3bdb4;
    --ivory-3: #a59d94;
    --amber: #fdb443;
    --amber-ink: #2b1401;
    --amber-text: #f9bf60;
    --ink: #1c140f;
    --ink-2: #49403a;
    --ink-3: #72665f;
    --sans: "Onest", "Hiragino Sans", "Apple SD Gothic Neo", "PingFang SC", "Noto Sans Georgian", "Geeza Pro", "Kohinoor Devanagari", system-ui, sans-serif;
    --W: 1320px;
    --H: 2868px;
    /* Google Play takes 9:16 only, so a Play panel is wider and shorter; the shot is scaled to its height. */
    --PW: var(--W);
    --PH: var(--H);
  }
  [data-size="play"] { --PW: 1440px; --PH: 2560px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: calc(var(--PW) * var(--n, 9)); height: var(--PH); overflow: hidden; background: var(--night); }
  body { font-family: var(--sans); color: var(--ivory); -webkit-font-smoothing: antialiased; position: relative; }
  .panel { position: absolute; top: 0; width: var(--PW); height: var(--PH); overflow: hidden; background: var(--night); }
  .shot { position: absolute; top: 0; left: 50%; width: var(--W); height: var(--H); margin-left: calc(var(--W) / -2); transform-origin: top center; }
  [data-size="play"] .shot { scale: 0.8926; }
  .abs { position: absolute; }

  /* Lantern light pooled in the dark room. */
  .pool { position: absolute; border-radius: 50%; background: radial-gradient(closest-side, #fdb44352, #f0a73224 45%, transparent); }

  /* Headline and the plain line under it. */
  .copy { position: absolute; left: 110px; width: 1100px; top: 200px; z-index: 10; }
  .copy.bottom { top: auto; bottom: 190px; }
  .copy.center { text-align: center; }
  .copy h1 { font-size: 148px; font-weight: 650; line-height: 1.0; letter-spacing: -0.035em; text-wrap: balance; }
  .copy h1 em { font-style: normal; color: var(--amber); }
  .copy p { margin-top: 44px; font-size: 54px; font-weight: 450; line-height: 1.28; letter-spacing: -0.01em; color: var(--ivory-2); max-width: 26ch; text-wrap: pretty; }
  .copy.center p { margin-inline: auto; }
  /* The first shot's headline matches the others; "Free" is its one solid amber mark. */
  .hero-copy .badge { margin-top: 44px; font-size: 52px; padding: 24px 52px; background: var(--amber); color: var(--amber-ink); font-weight: 500; box-shadow: 0 0 80px #fdb44366; }

  /* An iPhone drawn around a raw Simulator capture. */
  .phone {
    position: absolute; width: var(--pw); padding: calc(var(--pw) * 0.03); border-radius: calc(var(--pw) * 0.16);
    background: #0d0c0b; filter: drop-shadow(0 60px 120px #000c);
    box-shadow: inset 0 0 0 calc(var(--pw) * 0.004) #4a4541, 0 0 0 calc(var(--pw) * 0.006) #6f6a65, 0 0 0 calc(var(--pw) * 0.009) #2b2826;
  }
  .phone .screen { display: block; width: 100%; border-radius: calc(var(--pw) * 0.13); }
  .phone::before { content: ""; position: absolute; left: 50%; translate: -50% 0; top: calc(var(--pw) * 0.052); width: calc(var(--pw) * 0.27); height: calc(var(--pw) * 0.079); background: #000; border-radius: 999px; }
  .phone i { position: absolute; width: calc(var(--pw) * 0.012); background: #3a3633; border-radius: 4px; }
  .phone i.a { left: calc(var(--pw) * -0.017); top: 19%; height: 4%; }
  .phone i.b { left: calc(var(--pw) * -0.017); top: 26%; height: 7.5%; }
  .phone i.c { left: calc(var(--pw) * -0.017); top: 35%; height: 7.5%; }
  .phone i.d { right: calc(var(--pw) * -0.017); top: 28%; height: 11%; }

  /* Plates, cards and notes drawn in the app's own type and colours. */
  .np { position: absolute; background: var(--plate); color: var(--ivory); border-radius: 72px; box-shadow: 0 0 0 2px #ffffff12, 0 60px 120px -20px #000000d9; }
  .muted { color: var(--ivory-3); }
  .note { position: absolute; display: flex; align-items: center; gap: 28px; padding: 30px 54px 30px 30px; border-radius: 999px; background: var(--amber); color: var(--amber-ink); font-size: 50px; font-weight: 600; white-space: nowrap; z-index: 9; box-shadow: 0 40px 80px -20px #000000cc, 0 0 90px #fdb44366; }
  .note .dot { width: 116px; height: 116px; border-radius: 50%; background: var(--plate-2); display: grid; place-items: center; overflow: hidden; flex: none; }
  .face { position: absolute; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 12px var(--night), 0 40px 80px -10px #000000cc; }
  .face svg { width: 100%; height: 100%; display: block; }

  /* Ready decks: languages in their own scripts, then the subjects. */
  .langs { position: absolute; display: grid; gap: 40px; rotate: -8deg; }
  .langs div { display: flex; gap: 46px; align-items: baseline; white-space: nowrap; }
  .langs span { font-weight: 600; letter-spacing: -0.02em; color: var(--ivory); }
  .langs span.dim { color: #635c56; }
  .langs span.lit { color: var(--amber); text-shadow: 0 0 60px #fdb44399; }
  .topics { position: absolute; display: grid; gap: 26px; rotate: -8deg; }
  .topics div { display: flex; gap: 22px; white-space: nowrap; }
  .topic { display: inline-flex; align-items: center; gap: 24px; padding: 34px 52px 34px 34px; border-radius: 999px; background: var(--plate); font-size: 52px; font-weight: 550; box-shadow: 0 0 0 2px #ffffff12; }
  .topic.lit { background: var(--amber); color: var(--amber-ink); font-weight: 650; padding-inline: 56px; box-shadow: 0 0 80px -10px #fdb44399; }
  .topic i { width: 54px; height: 54px; border-radius: 16px; display: block; }

  /* Smart add: a textbook page in the camera's frame, and the terms picked from it. */
  .page { position: absolute; background: #f7f2e8; color: #2a2118; border-radius: 18px; padding: 80px 90px; font-family: Georgia, "Times New Roman", serif; box-shadow: 0 60px 120px -20px #000000e6; }
  .page h3 { font-size: 64px; font-weight: 700; letter-spacing: -0.01em; }
  .page h4 { font-size: 36px; font-weight: 400; letter-spacing: 0.14em; text-transform: uppercase; color: #8a7a66; margin: 40px 0 26px; }
  .page li { list-style: none; font-size: 46px; line-height: 1.75; }
  .page mark { background: linear-gradient(transparent 18%, #fdb44399 18%, #fdb44399 88%, transparent 88%); color: inherit; padding-inline: 6px; }
  .page .gl { color: #6d5e4e; }
  .frame { position: absolute; border: 0 solid var(--amber); width: 120px; height: 120px; }
  .pick { display: flex; align-items: center; gap: 40px; padding: 34px 0; border-top: 2px solid #ffffff12; }
  .pick:first-of-type { border-top: 0; }
  .pick .box { width: 72px; height: 72px; border-radius: 22px; background: var(--amber); display: grid; place-items: center; flex: none; }
  .pick .tm { font-size: 58px; font-weight: 600; letter-spacing: -0.02em; }
  .pick .mn { font-size: 42px; color: var(--ivory-3); margin-top: 2px; }

  /* Audio */
  .wave { display: flex; align-items: center; gap: 18px; }
  .wave i { width: 22px; border-radius: 11px; background: var(--amber); }
  .play { width: 260px; height: 260px; border-radius: 50%; background: var(--amber); display: grid; place-items: center; box-shadow: 0 0 120px #fdb44380; flex: none; }

  /* The first shot's price line. */
  .badge { margin-top: 40px; display: inline-flex; align-items: center; gap: 18px; padding: 22px 44px; border-radius: 999px; background: #fdb44324; color: var(--amber-text); font-size: 48px; font-weight: 600; box-shadow: 0 0 0 3px #fdb44366; }

  /* Works with your AI: the assistants' icons. */
  .squircle { position: absolute; width: 220px; height: 220px; border-radius: 58px; display: grid; place-items: center; z-index: 4; box-shadow: inset 0 0 0 3px #ffffff38, 0 0 0 2px #ffffff26, 0 40px 80px -16px #000000e6; }

  /* Learn together: who joined. */
  .joined { position: absolute; z-index: 8; display: flex; align-items: center; gap: 16px; padding: 22px 40px 22px 30px; border-radius: 999px; background: var(--amber); color: var(--amber-ink); font-size: 46px; font-weight: 650; white-space: nowrap; box-shadow: 0 30px 60px -16px #000000d9; }
  .joined::before { content: "+"; font-weight: 700; }

  /* Made for your language: one card per language and what it gets. */
  .lc { position: absolute; width: 1080px; background: #fff; color: var(--ink); border-radius: 64px; padding: 60px 70px; box-shadow: 0 60px 120px -20px #000000e6; }
  .lc .d { font-size: 38px; color: var(--ink-3); }
  .lc .t { font-weight: 600; letter-spacing: -0.02em; }
  .lc .a { font-size: 50px; color: var(--ink-2); margin-top: 22px; padding-top: 22px; border-top: 3px solid #2013081a; }
  .lc .feat { position: absolute; top: 50px; right: 60px; padding: 14px 34px; border-radius: 999px; background: #fdb44333; color: #9f4500; font-size: 40px; font-weight: 650; }

  .lc .a { display: flex; align-items: center; justify-content: space-between; }
  .say { width: 110px; height: 110px; border-radius: 50%; background: var(--amber); display: grid; place-items: center; flex: none; box-shadow: 0 0 50px #fdb44366; }
  .voice { position: absolute; z-index: 4; display: flex; align-items: center; gap: 34px; padding: 36px 60px 36px 36px; border-radius: 56px; background: #fff; color: var(--ink); box-shadow: 0 40px 80px -20px #000000e6; }
  .voice .sp { width: 130px; height: 130px; border-radius: 50%; background: var(--amber); display: grid; place-items: center; flex: none; }
  .voice .w { font-size: 72px; font-weight: 600; letter-spacing: -0.02em; white-space: nowrap; }
  .voice .l { font-size: 42px; color: var(--ink-3); margin-top: 2px; }
  .appcard { position: absolute; z-index: 4; width: 360px; padding: 40px 30px; text-align: center; border-radius: 56px; background: var(--plate-2); box-shadow: 0 0 0 2px #ffffff14, 0 50px 100px -20px #000000cc; }
  .appcard img { width: 150px; height: 150px; border-radius: 36px; display: block; margin: 0 auto; }
  .appcard .nm { font-size: 58px; font-weight: 650; letter-spacing: -0.02em; margin-top: 28px; }
  .appcard .mt { white-space: nowrap; font-size: 38px; color: var(--ivory-3); margin-top: 4px; }

  /* Your goal: the goal picker. */
  .goal { width: 620px; padding: 50px 50px 40px; }
  .gr { display: flex; align-items: center; gap: 30px; padding: 26px 34px; border-radius: 36px; font-size: 46px; color: var(--ivory-2); }
  .gr .n { font-size: 56px; font-weight: 650; color: var(--ivory); min-width: 110px; }
  .gr.on { background: #fdb44333; color: var(--amber-text); }
  .gr.on .n { color: var(--amber); }
  .gr .tick { margin-left: auto; width: 64px; height: 64px; border-radius: 50%; background: var(--amber); display: grid; place-items: center; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="art.js"></script>
<script src="copy.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  const lang = q.get("lang") ?? "en";
  document.documentElement.lang = lang;
  document.documentElement.dataset.size = q.get("size") ?? "iphone";
  const T = COPY[lang];
  const W = 1320, H = 2868;
  const raw = (name) => `raw/${lang}/${name}.png`;
  const brand = "../../../site/public/brand/";
  const stage = document.getElementById("stage");

  const el = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; };
  let shot;
  const add = (html) => { const node = el(html); shot.append(node); return node; };

  function panel(k) {
    const p = el(`<div class="panel" style="left:calc(var(--PW) * ${k})"><div class="shot"></div></div>`);
    stage.append(p);
    shot = p.firstChild;
  }
  function text(key, { pos = "", extra = "" } = {}) {
    const [h, p] = T.shots[key];
    add(`<div class="copy ${pos}"><h1>${h}</h1><p>${p}</p>${extra}</div>`);
  }
  const pool = (x, y, size) => add(`<div class="pool" style="left:${x}px;top:${y}px;width:${size}px;height:${size}px"></div>`);
  function phone(src, { pw = 960, x = (W - pw) / 2, y = 900, rot = 0, z = 2 } = {}) {
    const node = add(`<div class="phone" style="--pw:${pw}px;left:${x}px;top:${y}px;rotate:${rot}deg;z-index:${z}"><img class="screen" src="${src}"><i class="a"></i><i class="b"></i><i class="c"></i><i class="d"></i></div>`);
    return { src, pw, x, y, rot, node };
  }
  const mark = (name, size, fill) => {
    const m = ART.marks[name];
    return `<svg viewBox="0 0 24 24" width="${size}" height="${size}"><path d="${m.path}" fill-rule="${name === "Grok Bot" ? "evenodd" : "nonzero"}" fill="${fill ?? m.color ?? "#f1eee7"}"/></svg>`;
  };
  const check = `<svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="#2b1401" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;
  const speaker = (size, color, fill) => `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linecap="round"><path d="M11 5 6 9H3v6h3l5 4z" ${fill ? `fill="${color}"` : ""}/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>`;


  const shots = [
    // 1 · Learn anything: the lantern over the headline, Today in front and a review behind it.
    () => {
      add(`<div class="abs" style="left:-400px;top:-250px;width:2120px;height:2000px;border-radius:50%;background:radial-gradient(closest-side, #fdb44366, #f0a7322e 40%, transparent 70%);z-index:0"></div>`);
      add(`<img class="abs" src="${brand}lantern-dark.svg" style="width:300px;left:510px;top:140px;z-index:3;filter:drop-shadow(0 0 100px #fdb443aa)">`);
      add(`<div class="copy center hero-copy" style="top:470px"><h1>${T.shots.hero[0]}</h1><p>${T.shots.hero[1]}</p><span class="badge">${T.free}</span></div>`);
      phone(raw("02-review"), { pw: 800, x: -10, y: 1310, rot: -7, z: 2 });
      phone(raw("01-today"), { pw: 800, x: 520, y: 1210, rot: 5, z: 4 });
    },
    // 2 · Ready decks: no phone; the languages in their own scripts and the subjects people study for.
    () => {
      text("decks");
      pool(-300, 700, 1800);
      add(`<div class="langs" style="left:-380px;top:930px;width:2080px">
        ${T.decks.langs.map((r, k) => `<div style="margin-left:${[60, -120, 30, -80, 0][k]}px">${r.map(([w, size, c]) => `<span class="${c ?? ""}" style="font-size:${size}px">${w}</span>`).join("")}</div>`).join("")}</div>`);
      const tray = ["#f2b8a0", "#b9d3a6", "#c9b8f0", "#9cc5e8", "#e8a6b8", "#d8c79a"];
      let t = 0;
      add(`<div class="topics" style="left:-260px;top:2090px;width:3200px">
        ${T.decks.topics.map((r, k) => `<div style="margin-left:${[-1249, -261, -826, -1106, -696][k]}px">${r.map((n) => (n.startsWith("*") ? `<span class="topic lit">${n.slice(1)}</span>` : `<span class="topic"><i style="background:${tray[t++ % tray.length]}"></i>${n}</span>`)).join("")}</div>`).join("")}</div>`);
    },
    // 3 · Cards from your notes: a textbook page in the camera's frame, and the terms picked from it.
    () => {
      text("notes");
      pool(-200, 900, 1700);
      const s = T.smart;
      add(`<div class="page" style="left:120px;top:900px;width:960px;height:1120px;rotate:-5deg;z-index:2">
        <h3>Lezione 15 · In città</h3><h4>${s.vocab}</h4>
        <ul>${s.lines.map(([w, g, hi]) => `<li>${hi ? `<mark>${w}</mark>` : w} <span class="gl">— ${g}</span></li>`).join("")}</ul></div>`);
      [[110, 860, "border-top-width:12px;border-left-width:12px;border-top-left-radius:40px"], [1010, 800, "border-top-width:12px;border-right-width:12px;border-top-right-radius:40px"]].forEach(([x, y, b]) => {
        add(`<div class="frame" style="left:${x}px;top:${y}px;${b};rotate:-5deg;z-index:3"></div>`);
      });
      add(`<div class="np" style="left:170px;top:1720px;width:1040px;padding:40px 70px 56px;z-index:5">
        ${s.picked.map(([w, m]) => `<div class="pick"><span class="box">${check}</span><div><div class="tm">${w}</div><div class="mn">${m}</div></div></div>`).join("")}
        <div style="margin-top:34px;height:150px;border-radius:999px;background:var(--amber);color:var(--amber-ink);display:grid;place-items:center;font-size:56px;font-weight:650">${s.button}</div></div>`);
    },
    // 4 · Works with your AI: the assistants in a row, and what each of them did in Lymi.
    () => {
      text("ai");
      pool(-200, 1000, 1720);
      const icons = [["Claude", "#d97757", "#fff"], ["ChatGPT", "#0d0d0d", "#fff"], ["Gemini", "#ffffff", null], ["Grok", "#0d0d0d", "#fff"], ["Grok Bot", "#f1eee7", "#0d0d0d"], ["Other apps", "#fdb443", "#2b1401"]];
      icons.forEach(([n, bg, fg], k) => {
        add(`<div class="squircle" style="width:180px;height:180px;border-radius:48px;left:${70 + k * 200}px;top:${[830, 800, 845, 805, 840, 810][k]}px;background:${bg};rotate:${[-8, 5, -3, 6, -5, 7][k]}deg">${mark(n, 100, fg)}</div>`);
      });
      phone(raw("05-library"), { pw: 960, x: 180, y: 1150, rot: 0 });
      // What each assistant did, as notes on the Library.
      T.ai.notes.forEach(([n, note], k) => {
        // One note hangs off each side of the phone.
        const side = k === 0 ? "left:30px" : "right:30px";
        add(`<div class="note" style="${side};top:${[1640, 2060][k]}px;rotate:${[-4, 3][k]}deg"><span class="dot">${mark(n, 70)}</span>${note}</div>`);
      });
    },
    // 5 · Learn together: a shared deck on the phone, the people who joined it gathered on top of it.
    () => {
      text("together");
      pool(-200, 1000, 1720);
      phone(raw("07-deck"), { pw: 880, x: 250, y: 1000, rot: 3 });
      const g = T.together;
      [["japanese", 60, 1180, 250, -8, "#e8a6b8", "left"], ["polyglot", 1000, 1500, 260, 6, "#c9b8f0", "right"], ["streak", 40, 1900, 250, -5, "#f2b8a0", "left"], ["fresh", 1000, 2240, 240, 7, "#b9d3a6", "right"]].forEach(([id, x, y, size, rot, glow, side], k) => {
        add(`<div class="abs" style="left:${x - 70}px;top:${y - 70}px;width:${size + 140}px;height:${size + 140}px;border-radius:50%;background:radial-gradient(closest-side, ${glow}70, transparent);z-index:5"></div>`);
        add(`<div class="face" style="left:${x}px;top:${y}px;width:${size}px;height:${size}px;rotate:${rot}deg;z-index:6">${ART.avatars[id]}</div>`);
        const at = side === "left" ? `left:${x + size * 0.55}px` : `right:${Math.max(30, W - x - size * 0.45)}px`;
        add(`<div class="joined" style="${at};top:${y + size - 70}px;rotate:${-rot / 2}deg">${g.joined[k]}</div>`);
      });
    },
    // 6 · Hear every word: one card with its voice large, and three more languages speaking under it.
    () => {
      text("audio");
      pool(-200, 800, 1720);
      const a = T.audio;
      const bars = [40, 90, 150, 220, 300, 260, 380, 300, 200, 330, 420, 340, 240, 160, 260];
      add(`<div class="np" style="left:110px;top:800px;width:1100px;padding:80px 90px;z-index:3">
        <div class="muted" style="font-size:42px">${a.deck}</div>
        <div style="font-size:140px;font-weight:600;letter-spacing:-0.035em;margin-top:50px">la lampada</div>
        <div class="muted" style="font-size:56px;margin-top:6px">${a.meaning}</div>
        <div style="display:flex;align-items:center;gap:60px;margin-top:70px"><div class="play">${speaker(120, "#2b1401", true)}</div>
          <div class="wave">${bars.map((h) => `<i style="height:${h * 0.7}px"></i>`).join("")}</div></div>
        <div style="height:2px;background:#ffffff12;margin:80px 0 56px"></div>
        <div class="muted" style="font-size:40px">${a.example}</div>
        <div style="font-size:58px;margin-top:12px;line-height:1.3">Accendi la lampada, per favore.</div>
        <div style="display:flex;align-items:center;gap:24px;margin-top:34px;font-size:42px;color:var(--amber-text)">${speaker(56, "#f9bf60")}${a.play}</div></div>`);
      a.more.forEach(([w, l], k) => {
        add(`<div class="voice" style="left:${[80, 640, 320][k]}px;top:${[2150, 2190, 2430][k]}px;rotate:${[-5, 4, -2][k]}deg"><span class="sp">${speaker(54, "#2b1401", true)}</span><div><div class="w">${w}</div><div class="l">${l}</div></div></div>`);
      });
    },
    // 7 · Made for your language: no phone; a Japanese, a Chinese and a Ukrainian card with what each gets, each with its voice.
    () => {
      text("langs");
      pool(-200, 1000, 1720);
      const L = T.langs;
      // 天気 is てんき [1]: high on て, low after, and low on the particle that follows; drawn as the app draws it.
      const pitch = (() => {
        const xs = [50, 190, 330, 450], ys = [20, 80, 80, 80];
        const segs = xs.slice(1).map((x, k) => `<line x1="${xs[k]}" y1="${ys[k]}" x2="${x}" y2="${ys[k + 1]}" stroke="#49403a" stroke-width="5" stroke-linecap="round" ${k === 2 ? 'stroke-dasharray="2 12"' : ""}/>`).join("");
        const dots = xs.map((x, k) => `<circle cx="${x}" cy="${ys[k]}" r="${k === 3 ? 11 : 17}" fill="#fff" stroke="#49403a" stroke-width="5"/>`).join("");
        const kana = ["て", "ん", "き"].map((k, i) => `<text x="${xs[i]}" y="170" text-anchor="middle" font-size="58" fill="#49403a">${k}</text>`).join("");
        return `<svg viewBox="0 0 500 190" width="500" height="190">${segs}${dots}${kana}</svg>`;
      })();
      const say = `<span class="say">${speaker(54, "#2b1401", true)}</span>`;
      add(`<div class="lc" style="left:90px;top:840px;rotate:-4deg;z-index:3">
        <span class="feat">${L.jp}</span><div class="d">日本語 N5</div>
        <div style="display:flex;align-items:center;gap:80px;margin-top:30px"><div class="t" style="font-size:180px;line-height:1;white-space:nowrap;display:grid;justify-items:center"><span style="font-size:52px;font-weight:450;color:#49403a;letter-spacing:0.1em;margin-bottom:10px">てんき</span>天気</div>${pitch}</div>
        <div class="a">${L.jpMeaning}${say}</div></div>`);
      add(`<div class="lc" style="left:170px;top:1500px;rotate:3deg;z-index:4">
        <span class="feat">${L.zh}</span><div class="d">中文 HSK 1</div>
        <div class="t" style="display:flex;gap:8px;margin-top:20px">${[["学", "xué"], ["习", "xí"]].map(([h, p]) => `<ruby style="font-size:180px;line-height:1.15">${h}<rt style="font-size:56px;color:#49403a;font-weight:450">${p}</rt></ruby>`).join("")}</div>
        <div class="a">${L.zhMeaning}${say}</div></div>`);
      add(`<div class="lc" style="left:110px;top:2160px;rotate:-2deg;z-index:5">
        <span class="feat">${L.uk}</span><div class="d">Українська A1</div>
        <div class="t" style="font-size:170px;margin-top:30px;line-height:1.1">дя́кую</div>
        <div class="a">${L.ukMeaning}${say}</div></div>`);
    },
    // 8 · Bring your existing decks: the other apps' icons and what they hold, falling into Lymi.
    () => {
      text("import");
      pool(-150, 1350, 1620);
      const m = T.import;
      [["anki", "Anki", 80, 860, -3], ["quizlet", "Quizlet", 480, 860, 0], ["mochi", "Mochi", 880, 860, 3], ["noji", "Noji", 280, 1350, -2], ["pleco", "Pleco", 680, 1350, 2]].forEach(([f, n, x, y, r], k) => {
        add(`<div class="appcard" style="left:${x}px;top:${y}px;rotate:${r}deg"><img src="../../../site/public/apps/${f}.png" alt=""><div class="nm">${n}</div><div class="mt">${m.counts[k]}</div></div>`);
      });
      add(`<svg class="abs" style="left:590px;top:1790px" width="140" height="140" viewBox="0 0 24 24" fill="none" stroke="#fdb443" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v15M6 13l6 6 6-6"/></svg>`);
      add(`<img class="abs" src="${brand}app-icon-rounded.svg" style="left:500px;top:1980px;width:320px;height:320px;z-index:3;filter:drop-shadow(0 0 90px #fdb443aa)">`);
      add(`<div class="np" style="left:160px;top:2390px;width:1000px;padding:56px 70px;text-align:center;z-index:2">
        <div style="font-size:72px;font-weight:650;letter-spacing:-0.03em">${m.title}</div>
        <div class="muted" style="font-size:46px;margin-top:6px">${m.sub}</div></div>`);
    },
    // 9 · Your goal, your pace: the month of lit days behind, the goal picker and the streak in front.
    () => {
      text("streak", { pos: "center" });
      // Background only: the lantern's warm light rising from below, as on a slow dawn.
      add(`<div class="abs" style="left:-500px;top:1300px;width:2320px;height:2600px;border-radius:50%;background:radial-gradient(closest-side, #fdb4436b, #e0862e33 45%, transparent 75%);z-index:0"></div>`);
      add(`<div class="abs" style="left:-300px;top:200px;width:1100px;height:1100px;border-radius:50%;background:radial-gradient(closest-side, #fdb44324, transparent);z-index:0"></div>`);
      phone(raw("06-streak"), { pw: 880, x: 400, y: 1080, rot: 5 });
      const g = T.goal;
      add(`<div class="np goal" style="left:60px;top:1020px;rotate:-4deg;z-index:5">
        <div style="font-size:44px;font-weight:600;margin-bottom:20px">${g.title}</div>
        ${g.rows.map(([n, name], k) => `<div class="gr ${k === 2 ? "on" : ""}"><span class="n">${n}</span><span>${name}</span>${k === 2 ? `<span class="tick">${check}</span>` : ""}</div>`).join("")}
        <div class="gr"><span class="n">${g.custom}</span></div></div>`);
    },
  ];

  const only = q.get("only");
  const list = only ? only.split(",").map(Number) : shots.map((_, i) => i);
  window.PANELS = list.length;
  document.documentElement.style.setProperty("--n", list.length);
  list.forEach((i, k) => { panel(k); shots[i](); });
  // A long translation shrinks until each word fits the line and the headline keeps to three lines; set.mjs calls it once Onest has loaded.
  window.fit = () => {
    for (const h of document.querySelectorAll(".copy h1")) {
      let size = Number.parseFloat(getComputedStyle(h).fontSize);
      while ((h.scrollWidth > h.clientWidth + 1 || h.getBoundingClientRect().height > size * 3 + 1) && size > 90) {
        size -= 4;
        h.style.fontSize = `${size}px`;
      }
    }
  };
</script>
</body>
</html>

packages:
  - apps/*
  - packages/*

# Skia's postinstall copies its prebuilt iOS frameworks out of their npm package; CocoaPods needs them.
# PostHog's postinstall downloads the CLI binary that uploads the web build's source maps.
onlyBuiltDependencies:
  - "@posthog/cli"
  - "@shopify/react-native-skia"

# Expo's Babel preset and the worklets plugin import Babel 7 without declaring it; the web apps run Babel 8.
packageExtensions:
  babel-preset-expo:
    dependencies:
      "@babel/core": ^7.29.7
      "@babel/generator": ^7.29.0
      "@babel/traverse": ^7.29.0
      "@babel/types": ^7.29.0
  react-native-worklets:
    dependencies:
      "@babel/core": ^7.29.7
      "@babel/generator": ^7.29.0
      "@babel/traverse": ^7.29.0

# apple-targets 5.0.0 takes expo-widgets' extension for its own target; the patch matches by name only.
patchedDependencies:
  "@bacons/apple-targets@5.0.0": patches/@bacons__apple-targets@5.0.0.patch
  # @expo/ui 57.0.25 snaps a fitted sheet to each new height; the patch glides it through UIKit.
  "@expo/ui@57.0.25": patches/@expo__ui@57.0.25.patch
  # react-native-screens 4.26.2 snaps a form sheet to changed detents; the patch glides it.
  "react-native-screens@4.26.2": patches/react-native-screens@4.26.2.patch

# pnpm's default, spelled out because Electron Forge refuses to package without an explicit hoist pattern.
hoistPattern:
  - "*"
